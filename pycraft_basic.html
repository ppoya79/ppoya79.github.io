<script>
/* ===== 미니 파이썬 해석기 (print / input / 변수 / 자료형 / 연산 / f-string) ===== */
function pyRun(code,stdin,quiet){
 let out="";const inp=stdin.slice();
 const E=(name,msg)=>{throw {name,msg}};
 const mk=(t,v)=>({t,v});const NONE={t:'none'};
 const isNum=x=>x.t==='int'||x.t==='float'||x.t==='bool';
 const tname=x=>x.t==='none'?'NoneType':x.t==='type'?'type':x.t;
 const fmtF=v=>Number.isInteger(v)&&Math.abs(v)<1e16?v.toFixed(1):String(v);
 const S=x=>x.t==='str'?x.v:x.t==='int'?String(x.v):x.t==='float'?fmtF(x.v):x.t==='bool'?(x.v?'True':'False'):x.t==='none'?'None':"<class '"+x.v+"'>";
 const R=x=>x.t==='str'?"'"+x.v+"'":S(x);
 const truthy=x=>x.t==='none'?false:x.t==='str'?x.v.length>0:x.t==='type'?true:!!x.v;
 const vars={};
 function tokenize(s){
  const re=/\s*(?:(#.*)|(f?)("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\d+\.\d*|\.\d+|\d+)|([A-Za-z_가-힣][\w가-힣]*)|(\*\*|\/\/|==|!=|<=|>=|[-+*\/%()<>=,]))/y;
  const toks=[];let m;re.lastIndex=0;
  while(re.lastIndex<s.length){
   const st=re.lastIndex;
   if(/^\s*$/.test(s.slice(st)))break;
   m=re.exec(s);if(!m)E('SyntaxError','이해할 수 없는 문법이에요: '+s.slice(st).trim().slice(0,12));
   if(m[1])break;
   if(m[3]){const raw=m[3].slice(1,-1).replace(/\\(.)/g,(a,c)=>c==='n'?'\n':c==='t'?'\t':c);toks.push({k:'str',v:raw,f:m[2]==='f'})}
   else if(m[4])toks.push({k:'num',v:m[4]});
   else if(m[5])toks.push({k:'name',v:m[5]});
   else if(m[6])toks.push({k:'op',v:m[6]});
  }
  return toks;
 }
 function evalStr(src){return evalToks(tokenize(src),true)}
 function evalToks(toks,whole){
  let i=0;
  const pk=()=>toks[i],isOp=v=>toks[i]&&toks[i].k==='op'&&toks[i].v===v,isKw=v=>toks[i]&&toks[i].k==='name'&&toks[i].v===v;
  const num=x=>x.v===true?1:x.v===false?0:x.v;
  function arith(op,a,b){
   if(op==='+'){
    if(a.t==='str'&&b.t==='str')return mk('str',a.v+b.v);
    if(a.t==='str')E('TypeError','can only concatenate str (not "'+tname(b)+'") to str');
   }
   if(op==='*'&&((a.t==='str'&&b.t==='int')||(a.t==='int'&&b.t==='str'))){const s=a.t==='str'?a:b,n=a.t==='int'?a.v:b.v;return mk('str',s.v.repeat(Math.max(0,n)))}
   if(!isNum(a)||!isNum(b))E('TypeError',"unsupported operand type(s) for "+op+": '"+tname(a)+"' and '"+tname(b)+"'");
   const x=num(a),y=num(b),fl=a.t==='float'||b.t==='float';
   if((op==='/'||op==='//'||op==='%')&&y===0)E('ZeroDivisionError','division by zero');
   switch(op){
    case'+':return mk(fl?'float':'int',x+y);case'-':return mk(fl?'float':'int',x-y);case'*':return mk(fl?'float':'int',x*y);
    case'/':return mk('float',x/y);case'//':return mk(fl?'float':'int',Math.floor(x/y));
    case'%':return mk(fl?'float':'int',((x%y)+y)%y);
    case'**':return mk(fl||y<0?'float':'int',Math.pow(x,y));
   }
  }
  function cmp(op,a,b){
   let x,y;
   if(isNum(a)&&isNum(b)){x=num(a);y=num(b)}
   else if(a.t===b.t&&(a.t==='str'||a.t==='none')){x=a.v;y=b.v}
   else{if(op==='==')return mk('bool',false);if(op==='!=')return mk('bool',true);E('TypeError',"'"+op+"' not supported between instances of '"+tname(a)+"' and '"+tname(b)+"'")}
   return mk('bool',op==='=='?x===y:op==='!='?x!==y:op==='<'?x<y:op==='>'?x>y:op==='<='?x<=y:x>=y);
  }
  const B={
   int(a){const x=a[0];if(!x)return mk('int',0);if(x.t==='str'){if(!/^\s*[+-]?\d+\s*$/.test(x.v))E('ValueError',"invalid literal for int() with base 10: '"+x.v+"'");return mk('int',parseInt(x.v,10))}if(isNum(x))return mk('int',Math.trunc(num(x)));E('TypeError',"int() argument must be a string or a number, not '"+tname(x)+"'")},
   float(a){const x=a[0];if(!x)return mk('float',0);if(x.t==='str'){if(!/^\s*[+-]?(\d+\.?\d*|\.\d+)\s*$/.test(x.v))E('ValueError',"could not convert string to float: '"+x.v+"'");return mk('float',parseFloat(x.v))}if(isNum(x))return mk('float',num(x));E('TypeError',"float() argument must be a string or a number")},
   str(a){return mk('str',a.length?S(a[0]):'')},
   bool(a){return mk('bool',a.length?truthy(a[0]):false)},
   type(a){return mk('type',tname(a[0]))},
   len(a){if(a[0]&&a[0].t==='str')return mk('int',[...a[0].v].length);E('TypeError',"object of type '"+tname(a[0])+"' has no len()")},
   round(a){const x=num(a[0]);if(a[1]){const n=a[1].v;return mk('float',Number(x.toFixed(n)))}return mk('int',Math.round(x))},
   input(a){if(!quiet&&a[0])out+=S(a[0]);if(!inp.length)E('EOFError','입력값이 부족해요. 아래 "입력값" 칸에 줄마다 값을 적어 주세요.');const v=inp.shift();if(!quiet)out+=v+"\n";return mk('str',v)},
   print(a,kw){const sep=kw.sep?S(kw.sep):' ',end=kw.end?S(kw.end):'\n';out+=a.map(S).join(sep)+end;return NONE}
  };
  function fstring(s){
   return mk('str',s.replace(/\{([^{}]*)\}/g,(m,ex)=>{
    let spec=null;const mm=ex.match(/^(.*):(\.\d+f)$/);if(mm){ex=mm[1];spec=mm[2]}
    const v=evalStr(ex);
    if(spec){if(!isNum(v))E('ValueError','숫자만 .2f 형식을 쓸 수 있어요');return num(v).toFixed(parseInt(spec.slice(1),10))}
    return S(v)}));
  }
  function atom(){
   const t=toks[i++];if(!t)E('SyntaxError','식이 끝나지 않았어요');
   if(t.k==='num')return t.v.includes('.')?mk('float',parseFloat(t.v)):mk('int',parseInt(t.v,10));
   if(t.k==='str')return t.f?fstring(t.v):mk('str',t.v);
   if(t.k==='op'&&t.v==='('){const v=or();if(!isOp(')'))E('SyntaxError',"')' 닫는 괄호가 빠졌어요");i++;return v}
   if(t.k==='name'){
    if(t.v==='True')return mk('bool',true);if(t.v==='False')return mk('bool',false);if(t.v==='None')return NONE;
    if(isOp('(')){
     i++;const args=[],kw={};
     while(!isOp(')')){
      if(!pk())E('SyntaxError',"')' 닫는 괄호가 빠졌어요");
      if(pk().k==='name'&&toks[i+1]&&toks[i+1].k==='op'&&toks[i+1].v==='='){const k=pk().v;i+=2;kw[k]=or()}else args.push(or());
      if(isOp(','))i++;else if(!isOp(')'))E('SyntaxError','쉼표(,)나 닫는 괄호가 필요해요');
     }
     i++;
     if(!B[t.v])E('NameError',"name '"+t.v+"' is not defined");
     return B[t.v](args,kw);
    }
    if(!(t.v in vars))E('NameError',"name '"+t.v+"' is not defined");
    return vars[t.v];
   }
   E('SyntaxError','잘못된 문법이에요: '+t.v);
  }
  function pow(){const a=atom();if(isOp('**')){i++;return arith('**',a,unary())}return a}
  function unary(){if(isOp('-')){i++;const v=unary();if(!isNum(v))E('TypeError','숫자에만 - 를 쓸 수 있어요');return mk(v.t==='float'?'float':'int',-num(v))}return pow()}
  function mul(){let a=unary();while(isOp('*')||isOp('/')||isOp('//')||isOp('%')){const o=toks[i++].v;a=arith(o,a,unary())}return a}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const o=toks[i++].v;a=arith(o,a,mul())}return a}
  function comp(){let a=add();while(['==','!=','<','>','<=','>='].some(isOp)){const o=toks[i++].v;a=cmp(o,a,add())}return a}
  function not(){if(isKw('not')){i++;return mk('bool',!truthy(not()))}return comp()}
  function and(){let a=not();while(isKw('and')){i++;const b=not();a=truthy(a)?b:a}return a}
  function or(){let a=and();while(isKw('or')){i++;const b=and();a=truthy(a)?a:b}return a}
  let r;
  const KW=['True','False','None','not','and','or'];
  function targets(){
   let j=i;const names=[];
   while(toks[j]&&toks[j].k==='name'&&!KW.includes(toks[j].v)){
    names.push(toks[j].v);j++;
    if(toks[j]&&toks[j].k==='op'&&toks[j].v===','){j++;continue}
    break;
   }
   if(names.length&&toks[j]&&toks[j].k==='op'&&toks[j].v==='='){i=j+1;return names}
   return null;
  }
  if(!whole){
   const groups=[];let t;
   while((t=targets()))groups.push(t);
   if(groups.length){
    const vals=[or()];
    while(isOp(',')){i++;vals.push(or())}
    for(const g of groups){
     if(g.length!==vals.length)E('ValueError',g.length>vals.length?'값이 부족해요: 변수 '+g.length+'개에 값 '+vals.length+'개':'값이 너무 많아요: 변수 '+g.length+'개에 값 '+vals.length+'개');
     g.forEach((n,k)=>vars[n]=vals[k]);
    }
    r=vals[0];
   }else r=or();
  }else r=or();
  if(i<toks.length)E('SyntaxError','여기서 문법이 끝나야 해요: '+toks[i].v);
  return r;
 }
 let err=null;
 const lines=code.split('\n');
 for(let n=0;n<lines.length;n++){
  const ln=lines[n];if(!ln.trim()||ln.trim().startsWith('#'))continue;
  try{
   if(/^\s/.test(ln))E('IndentationError','이 단계에서는 줄 앞에 공백을 넣지 않아요');
   const toks=tokenize(ln);if(toks.length)evalToks(toks,false);
  }catch(e){if(e&&e.name){err=(n+1)+'번째 줄 '+e.name+': '+e.msg;break}else{err=(n+1)+'번째 줄 오류: '+e;break}}
 }
 return {out,err,vars};
}

/* ===== 앱 ===== */

/* 페이지 안 대화상자 (prompt/confirm 이 막힌 환경 대응) */
function modal(html,onOk,withInput){
 const old=document.getElementById('mdl');if(old)old.remove();
 const d=document.createElement('div');d.id='mdl';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:flex;align-items:center;justify-content:center';
 d.innerHTML='<div class="panel" style="min-width:280px;max-width:90%;margin:0"><p style="font-weight:700">'+html+'</p>'+(withInput?'<input id="mdlIn" type="password" style="width:100%;padding:8px;font-size:16px;border:3px solid #000" autocomplete="off">':'')+'<div id="mdlMsg" class="msg bad"></div><div class="row"><button class="btn go" id="mdlOk">확인</button><button class="btn" id="mdlNo">취소</button></div></div>';
 document.body.appendChild(d);
 const close=()=>d.remove();
 const go=()=>{const v=withInput?document.getElementById('mdlIn').value:true;if(onOk(v,close)!==false)close()};
 document.getElementById('mdlOk').onclick=go;document.getElementById('mdlNo').onclick=close;
 if(withInput){const i=document.getElementById('mdlIn');i.focus();i.onkeydown=e=>{if(e.key==='Enter')go();if(e.key==='Escape')close()}}
}
function ask(msg,fn){modal(msg,()=>{fn()})}
const TEACHER_PW="2026"; // ← 여기를 원하는 비밀번호로 바꾸세요
let S;try{S=JSON.parse(localStorage.getItem('pycraft2')||'null')}catch(e){}
if(!S||!Array.isArray(S.done))S={done:[],hearts:10};
const save=()=>{try{localStorage.setItem('pycraft2',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
function completeAll(){
 ask('모든 미션을 완료로 표시할까요?',()=>{S.done=L.map((_,i)=>i);save();home()});
}
function clearProgress(){
 ask('완료 표시를 모두 해제할까요? (교사 모드는 유지)',()=>{S.done=[];S.hearts=10;save();home()});
}
function adminMode(){
 if(S.admin){S.admin=false;save();home();return}
 modal('교사 비밀번호를 입력하세요',(p)=>{
  if(p===TEACHER_PW){S.admin=true;save();home();return true}
  document.getElementById('mdlMsg').textContent='비밀번호가 틀렸어요.';return false;
 },true);
}
function hud(){
 const ab=$('admBtn');if(ab)ab.textContent=S.admin?'🔓 교사 모드 ON (끄기)':'🔑 교사 모드';
 $('hearts').textContent="❤".repeat(S.hearts)+"🖤".repeat(10-S.hearts);
 $('xp').style.width=(S.done.length/L.length*100)+"%";$('xpn').textContent=S.done.length+"/"+L.length;
 $('inv').textContent=S.done.length?S.done.map(i=>L[i].item).join(" "):"비어있음";
}
function home(){
 hud();
 let h=`<div class="panel"><h2>⛏ 파이썬 기초 마을</h2><p>주제: <b>print · input · 자료형</b>. 코드는 이 페이지 안에서 실제로 실행돼요. 틀리거나 힌트를 보면 ❤ 가 줄어요.</p></div><h2 style="color:#7bdc4e">🗺 월드 맵</h2><div class="map">`;
 L.forEach((l,i)=>{const d=S.done.includes(i),lock=i>0&&!S.done.includes(i-1)&&!S.admin;
  h+=`<div class="lv ${d?'done':''} ${lock?'lock':''}" ${lock?'':`onclick="level(${i})"`}><div class="ic">${lock?'🔒':l.ic}</div><h3>${l.t}</h3><p>${l.s}${d?' ✅':''}<span class="tag">${l.quiz?'퀴즈':'코딩'}</span></p></div>`});
 h+="</div>";
 if(S.admin)h+=`<div class="row"><button class="btn go" onclick="completeAll()">✅ 모든 미션 완료 처리</button><button class="btn" onclick="clearProgress()">↺ 완료 표시만 해제</button></div>`;
 if(S.done.length===L.length)h+=`<div class="panel pop"><h2>🏆 엔더 드래곤 격파!</h2>print, input, 자료형을 모두 익혔어요. 다음 단계는 <b>if 조건문</b>과 <b>for 반복문</b>이에요!</div>`;
 $('app').innerHTML=h;
}
let cur=0,qi=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function head(l){return `<button class="btn" onclick="home()">← 맵</button><h2 style="margin-top:12px">${l.ic} ${l.t} <small>– ${l.s}</small></h2><div class="world" id="world">${l.world||'📘 퀴즈 타임'}</div><div class="story">📖 ${l.story}</div><div class="learn">💡 ${l.learn}</div>`}
function level(i){
 cur=i;qi=0;const l=L[i];
 if(l.quiz){quiz();return}
 $('app').innerHTML=`<div class="panel">${head(l)}
 <p>🎯 <b>미션:</b> ${l.task}</p>
 <label>코드</label><textarea id="code" spellcheck="false">${esc(l.start)}</textarea>
 ${l.stdin!==undefined?`<label>⌨ 입력값 (input() 이 읽을 값, 한 줄에 하나)</label><textarea id="stdin" spellcheck="false">${esc(l.stdin)}</textarea>`:''}
 <div class="row"><button class="btn" onclick="runCode()">▶ 실행</button><button class="btn go" onclick="submit()">✔ 제출</button><span class="hint" onclick="showHint()">힌트 보기 (❤-1)</span></div>
 <div class="out" id="out">(실행 결과가 여기에 나와요)</div><div class="msg" id="msg"></div></div>`;
 $('code').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+"    "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4}});
}
function quiz(){
 const l=L[cur],q=l.qs[qi];
 $('app').innerHTML=`<div class="panel">${head(l)}<h3>문제 ${qi+1} / ${l.qs.length}</h3><p style="font-size:17px">${q.q}</p>`+
 q.c.map((c,k)=>`<button class="btn ch" onclick="ans(${k})">${'①②③④'[k]} ${esc(c)}</button>`).join('')+`<div class="msg" id="msg"></div></div>`;
}
function ans(k){
 const l=L[cur],q=l.qs[qi];
 if(k===q.a){
  $('msg').className="msg ok";
  if(qi<l.qs.length-1){$('msg').innerHTML=`⭕ 정답! ${q.e} <button class="btn go" onclick="qi++;quiz()">다음 문제 →</button>`}
  else{if(!S.done.includes(cur))S.done.push(cur);save();hud();
   $('msg').innerHTML=`⭕ 정답! ${q.e}<br>✅ 퀴즈 클리어! ${l.item} 획득! <button class="btn go" onclick="level(${cur+1})">다음 미션 →</button>`}
 }else{$('msg').className="msg bad";$('msg').textContent="❌ 아쉬워요. 위의 설명을 다시 읽고 도전해 보세요.";lose()}
}
function lose(){if(S.hearts>1)S.hearts--;else{S.hearts=10;if($('msg'))$('msg').innerHTML+=" 💀 리스폰! 체력이 회복됐어요."}save();hud()}
function stdinVal(){const e=$('stdin');return e?e.value.split('\n'):[]}
function runCode(){
 const r=pyRun($('code').value,stdinVal(),false);
 $('out').textContent=(r.out||"(출력 없음)")+(r.err?"\n\n💥 "+r.err:"");
}
function submit(){
 const l=L[cur],code=$('code').value;
 $('out').textContent="";
 let fail=null;
 for(const t of l.tests){
  const r=pyRun(code,t.in,true);
  if(r.err){fail="💥 "+r.err;break}
  if(r.out.trimEnd()!==t.out){fail="💥 입력 "+(t.in.length?JSON.stringify(t.in):"없음")+" 일 때 결과가 달라요.\n기대: "+t.out+"\n내 결과: "+(r.out.trimEnd()||"(없음)");break}
 }
 if(!fail&&l.need&&!l.need.every(re=>re.test(code)))fail="💥 이 미션에서 사용하라고 한 기능을 써 주세요. (힌트 참고)";
 if(fail){$('out').textContent=fail;$('msg').className="msg bad";$('msg').textContent="아직이에요. 오타·따옴표·괄호를 확인해 보세요.";lose();return}
 if(!S.done.includes(cur))S.done.push(cur);save();hud();
 const r=pyRun(code,l.stdin!==undefined?stdinVal():[],false);
 $('out').textContent=r.out||"";
 $('msg').className="msg ok";$('msg').innerHTML=`✅ 성공! ${l.item} 획득! `+(cur<L.length-1?`<button class="btn go" onclick="level(${cur+1})">다음 미션 →</button>`:`<button class="btn go" onclick="home()">🏆 맵으로</button>`);
 $('world').classList.add('pop');$('world').textContent="✨ "+l.item+" 획득! ✨";
}
function showHint(){$('out').textContent="힌트:\n"+L[cur].hint;lose()}
function resetAll(){ask('진행 상황을 모두 지울까요?',()=>{S={done:[],hearts:10};save();home()})}
home();
</script></body></html>
