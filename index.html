<!DOCTYPE html>
<!-- PROJECT ROMAN 단일 배포판 — 단일배포_빌드.js로 생성. 원본 페이지 수정 후 재생성할 것. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT ROMAN — 로만 우주망원경 통합 화면</title>
<style>
  :root{--bg:#0b1026;--card:#131a33;--line:#2a355f;--txt:#e8ecf8;--sub:#9aa7cc;--gold:#ffd166;--cyan:#6ee7ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{padding:14px 18px 0}
  h1{margin:0;font-size:24px;letter-spacing:-0.3px}
  h1 .accent{color:var(--gold)}
  .sub{margin:6px 0 0;font-size:13.5px;color:var(--sub)}
  .byline{margin:4px 0 0;font-size:11px;color:var(--sub);text-align:right}
  .tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
  .tabs button{font-family:inherit;font-size:15px;font-weight:bold;padding:10px 20px;border:1px solid var(--line);
    border-bottom:none;background:var(--card);color:var(--sub);cursor:pointer;border-radius:10px 10px 0 0}
  .tabs button[aria-selected="true"]{background:#1d2a55;color:var(--gold);border-color:#3a4a80}
  .frameWrap{padding:0 18px}
  .frame{width:100%;height:calc(100vh - 128px);border:1px solid var(--line);border-top:2px solid #2b4c9b;
    border-radius:0 0 10px 10px;background:#0b1026;display:none}
  .frame.on{display:block}
  .hint{padding:6px 18px 12px;font-size:12px;color:#7f8cc0}
  .hint a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>PROJECT <span class="accent">ROMAN</span></h1>
  <p class="byline">제작자: 용남고 정보쌤(ppo)</p>
  <p class="sub">위치 추적 · L2 도착 대시보드 · 미션 시뮬레이션 · 데이터 분석 실습 · 보간 연습 — 탭을 누르면 아래에 관련 페이지가 열립니다.
    모든 페이지는 오프라인에서 동작하며 NASA 궤적 데이터가 각 파일에 내장되어 있습니다.</p>
</header>
<nav class="tabs" role="tablist">
  <button type="button" id="hbTrack" aria-selected="true">위치 추적</button>
  <button type="button" id="hbArrival" aria-selected="false">도착예정</button>
  <button type="button" id="hbGame" aria-selected="false">시뮬레이션</button>
  <button type="button" id="hbData" aria-selected="false">데이터 분석</button>
  <button type="button" id="hbInterp" aria-selected="false">보간연습</button>
</nav>
<div class="frameWrap">
  <iframe class="frame on" id="frTrack" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;로만, 지금 어디? — 낸시 그레이스 로만 우주망원경 위치 추적&lt;/title&gt;
&lt;style&gt;
  :root{
    --bg:#0b1026; --bg2:#101736; --card:#141c3a; --card2:#1a2350;
    --line:#2a3566; --txt:#e8ecf8; --sub:#9aa7cc; --gold:#ffd166;
    --cyan:#6ee7ff; --blue:#5b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #1a2450 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--txt);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    line-height:1.6; font-size:16px;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 40px}
  header{padding:26px 0 8px}
  .kicker{color:var(--cyan);font-size:13px;letter-spacing:2px;font-weight:bold}
  h1{margin:4px 0 6px;font-size:34px;line-height:1.25}
  h1 .accent{color:var(--gold)}
  .lead{color:var(--sub);font-size:15px;margin:0 0 14px}
  .badgeRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .badge{
    display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;
    background:var(--card2);border:1px solid var(--line);color:var(--txt);text-decoration:none;
  }
  .badge.gold{border-color:#8a6a1f;color:var(--gold);font-weight:bold}
  .badge.cy{border-color:#1f5a6a;color:var(--cyan)}
  .badge.warn{border-color:#8a3a3a;color:#ffb0b0;display:none}
  .badge.warn.on{display:inline-block}
  h2{font-size:20px;margin:34px 0 4px}
  .hsub{color:var(--sub);font-size:13px;margin:0 0 12px}
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-top:10px}
  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .card .lab{font-size:12.5px;color:var(--sub);letter-spacing:.5px}
  .card .val{font-size:26px;font-weight:bold;margin-top:4px;font-variant-numeric:tabular-nums;word-break:keep-all}
  .card .val small{font-size:14px;font-weight:normal;color:var(--sub)}
  .card .sub{font-size:12.5px;color:var(--sub);margin-top:4px}
  .card.hero .val{font-size:30px;color:var(--gold)}
  .progWrap{height:12px;background:#0d1330;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
  .progFill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}
  .mapBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:10px}
  .mapBox svg{display:block;width:100%;height:auto}
  .mapTitle{font-size:13px;color:var(--sub);padding:6px 8px 0;font-weight:bold}
  .timeBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
  .tRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tBtn{
    padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;
  }
  .tBtn:hover{background:#233062}
  .tBtn.primary{background:var(--gold);color:#201600;border-color:#8a6a1f}
  input[type=range]{flex:1 1 240px;accent-color:var(--gold);height:26px}
  .tInfo{font-size:14px;font-variant-numeric:tabular-nums}
  .tInfo b{color:var(--gold)}
  .tUTC{font-size:12px;color:var(--sub)}
  .marks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:2px}
  .adoptBox{display:grid;grid-template-columns:360px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
  @media (max-width:760px){.adoptBox{grid-template-columns:1fr}}
  .pixelPanel{display:flex;align-items:center;justify-content:center}
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .steps li:last-child{border-bottom:none}
  .stepNum{
    flex:0 0 30px;height:30px;border-radius:50%;background:var(--gold);color:#201600;
    font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .steps b{color:var(--gold)}
  .note{font-size:13px;color:var(--sub);margin-top:10px}
  .bigLink{
    display:inline-block;margin-top:12px;padding:11px 20px;border-radius:10px;background:var(--gold);
    color:#201600;font-weight:bold;text-decoration:none;font-size:15px;border:1px solid #8a6a1f;
  }
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:10px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .fact h3{margin:0 0 6px;font-size:16px;color:var(--cyan)}
  .fact p{margin:0;font-size:14px;color:var(--txt)}
  footer{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--sub)}
  footer p{margin:4px 0}
  #noData{
    display:none;background:#2a1520;border:1px solid #8a3a3a;color:#ffd9d9;border-radius:14px;
    padding:18px;margin-top:14px;font-size:14px;
  }
  #noData.on{display:block}
  @keyframes pulse{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
  .pulse{animation:pulse 1.6s infinite}
  .pfBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:18px}
  .pfRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pfRow label{font-size:13px;color:var(--sub)}
  .pfRow input{background:#0d1230;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}
  #pixInput{width:160px}
  #pixName{width:110px}
  .pfError{color:#ff9c9c;font-size:13px;min-height:18px;margin-top:6px}
  .pfWrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:4px}
  #pixMosaic{flex:1 1 560px;max-width:760px;width:100%;height:auto;background:#0a0e22;border:1px solid var(--line);border-radius:12px}
  .pfInfo{flex:1 1 220px;min-width:220px;font-size:14px;line-height:1.8;color:var(--txt)}
  .pfInfo b{color:var(--gold)}
  .pfInfo .small{color:var(--sub);font-size:12px}
  .pfSavedHead{margin-top:14px;font-size:12.5px;color:var(--sub)}
  .pfSaved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12.5px;color:var(--sub)}
  .pfChip,.pfDel{cursor:pointer;border-radius:999px;padding:4px 11px;font-size:12.5px;font-family:inherit}
  .pfChip{background:#132046;color:#cfe0ff;border:1px solid #2a3f7a}
  .pfChip:hover{background:#1b2c5e}
  .pfDel{background:#2a1520;color:#ff9c9c;border:1px solid #8a3a3a}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;

&lt;header&gt;
  &lt;div class=&quot;kicker&quot;&gt;NASA · NANCY GRACE ROMAN SPACE TELESCOPE&lt;/div&gt;
  &lt;h1&gt;로만, 지금 어디? &lt;span class=&quot;accent&quot;&gt;/ 150만 km의 여행&lt;/span&gt;&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;
    낸시 그레이스 로만 우주망원경은 2026년 8월 30일에 발사되어 지구에서 약 150만 km 떨어진
    태양-지구 L2점으로 이동하고 있습니다. NASA가 공개하는 궤적 데이터(이 파일에 내장)로 로만의 현재 위치를 확인해 보세요.
  &lt;/p&gt;
  &lt;div class=&quot;badgeRow&quot;&gt;
    &lt;a class=&quot;badge gold&quot; href=&quot;https://science.nasa.gov/mission/roman-space-telescope/adopt-a-pixel/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Adopt a Pixel — 첫 이미지 픽셀 분양 중&lt;/a&gt;
    &lt;span class=&quot;badge cy&quot;&gt;내장 데이터 갱신일: &lt;span id=&quot;srcFetched&quot;&gt;—&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;badge warn&quot; id=&quot;rangeWarn&quot;&gt;표시 시각이 내장 데이터 범위를 벗어났습니다 — 데이터갱신.bat 실행 필요&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;noData&quot;&gt;
    내장 궤적 데이터가 없습니다. 이 폴더의 &lt;b&gt;데이터갱신.bat&lt;/b&gt;을 더블클릭해 실행하면(인터넷 필요)
    NASA 궤적 데이터가 이 파일에 자동으로 저장됩니다. 저장 후 이 페이지를 다시 열어 주세요.
  &lt;/div&gt;
&lt;/header&gt;

&lt;h2&gt;로만의 현재 상태&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;아래 시간 탐색 슬라이더로 발사 직후부터 예측 궤적 끝까지 어느 시점이든 볼 수 있습니다.&lt;/p&gt;
&lt;section class=&quot;dash&quot; id=&quot;dash&quot;&gt;
  &lt;div class=&quot;card hero&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;지구에서 로만까지&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vDist&quot;&gt;—&lt;/span&gt; &lt;small&gt;km&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sDist&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;현재 속도 (지구 기준)&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vSpeed&quot;&gt;—&lt;/span&gt; &lt;small&gt;km/h&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sSpeed&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;발사 후 경과&lt;/div&gt;
    &lt;div class=&quot;val&quot; id=&quot;vElapsed&quot;&gt;—&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sElapsed&quot;&gt;발사: 2026. 8. 30. 20:26 KST&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;L2 여정 진행률&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vProg&quot;&gt;—&lt;/span&gt; &lt;small&gt;%&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;progWrap&quot;&gt;&lt;div class=&quot;progFill&quot; id=&quot;progFill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sProg&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;신호 지연 시간&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vLight&quot;&gt;—&lt;/span&gt; &lt;small&gt;초&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sLight&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;h2&gt;지구 근방 확대 지도&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;위쪽 = 태양 반대방향(L2 쪽). 실선은 지나온 길, 점선은 NASA 예측 궤적, 흰 점은 지금 위치입니다.&lt;/p&gt;
&lt;div class=&quot;mapBox&quot;&gt;
  &lt;div class=&quot;mapTitle&quot;&gt;지구를 중심으로 본 로만의 여정 (단위: km, 황도면을 위에서 본 그림)&lt;/div&gt;
  &lt;svg id=&quot;zoomMap&quot; viewBox=&quot;0 0 900 740&quot; role=&quot;img&quot; aria-label=&quot;지구 중심 로만 궤적 지도&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;div class=&quot;mapBox&quot;&gt;
  &lt;div class=&quot;mapTitle&quot;&gt;태양계 전경 — 로만은 지구와 함께 태양을 공전합니다&lt;/div&gt;
  &lt;svg id=&quot;solarMap&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;태양과 지구 궤도 전경 지도&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;

&lt;h2&gt;시간 탐색&lt;/h2&gt;
&lt;div class=&quot;timeBox&quot;&gt;
  &lt;div class=&quot;tRow&quot;&gt;
    &lt;button class=&quot;tBtn primary&quot; id=&quot;btnPlay&quot; type=&quot;button&quot;&gt;여정 재생&lt;/button&gt;
    &lt;button class=&quot;tBtn&quot; id=&quot;btnStop&quot; type=&quot;button&quot;&gt;정지&lt;/button&gt;
    &lt;button class=&quot;tBtn&quot; id=&quot;btnNow&quot; type=&quot;button&quot;&gt;지금 보기&lt;/button&gt;
    &lt;input type=&quot;range&quot; id=&quot;timeSlider&quot; min=&quot;0&quot; max=&quot;1000&quot; value=&quot;1000&quot; step=&quot;1&quot; aria-label=&quot;시간 탐색 슬라이더&quot;&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tInfo&quot;&gt;표시 시각: &lt;b id=&quot;tLabel&quot;&gt;—&lt;/b&gt; &lt;span class=&quot;tUTC&quot; id=&quot;tLabelUTC&quot;&gt;&lt;/span&gt; &lt;span id=&quot;tMode&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;marks&quot;&gt;
    &lt;span&gt;발사 직후&lt;/span&gt;
    &lt;span id=&quot;markNow&quot;&gt;지금&lt;/span&gt;
    &lt;span&gt;예측 궤적 끝&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;Adopt a Pixel — 첫 이미지의 픽셀을 분양받아요&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;로만이 우주를 처음 촬영하면, 그 이미지의 픽셀 하나하나가 신청자에게 배정됩니다.&lt;/p&gt;
&lt;section class=&quot;adoptBox&quot;&gt;
  &lt;div class=&quot;pixelPanel&quot;&gt;
    &lt;svg id=&quot;pixelSvg&quot; viewBox=&quot;0 0 344 260&quot; role=&quot;img&quot; aria-label=&quot;픽셀 격자 그림&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;ol class=&quot;steps&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;1&lt;/span&gt;&lt;span&gt;&lt;b&gt;이메일로 신청&lt;/b&gt; — NASA Adopt a Pixel 페이지에서 이메일 주소 하나당 픽셀 하나를 분양받습니다. (가족이 이메일을 함께 쓴다면 그 픽셀을 함께 공유해요)&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;2&lt;/span&gt;&lt;span&gt;&lt;b&gt;첫 촬영을 기다림&lt;/b&gt; — 로만이 L2점에 도달해 시운전을 마친 뒤, 우주를 향해 첫 관측을 시작합니다.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;3&lt;/span&gt;&lt;span&gt;&lt;b&gt;픽셀 수령&lt;/b&gt; — 첫 이미지가 공개되면 내 픽셀 번호와 인증서를 이메일로 받습니다. 인쇄해서 친구들에게 자랑할 수 있어요!&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;note&quot;&gt;
      왼쪽 격자는 첫 이미지의 모습을 본떠 그린 그림입니다. 반짝이는 칸 하나가 내 픽셀 —
      역사적인 첫 이미지의 한 조각이 되는 것입니다.
    &lt;/div&gt;
    &lt;a class=&quot;bigLink&quot; href=&quot;https://science.nasa.gov/mission/roman-space-telescope/adopt-a-pixel/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NASA Adopt a Pixel 페이지 열기&lt;/a&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;h2&gt;내 픽셀 찾기&lt;/h2&gt;
&lt;section class=&quot;pfBox&quot;&gt;
  &lt;div class=&quot;pfRow&quot;&gt;
    &lt;label for=&quot;pixInput&quot;&gt;픽셀 번호&lt;/label&gt;

&lt;h2&gt;로만 이야기&lt;/h2&gt;
&lt;section class=&quot;facts&quot;&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;발사&lt;/h3&gt;
    &lt;p&gt;2026년 8월 30일 20:26(KST), 플로리다 케네디 우주센터에서 스페이스X 팰컨 헤비 로켓으로 발사되었습니다.
       20:57경 로켓 2단에서 분리되어 홀로 우주를 날기 시작했고, 태양광 차폐막 6판이 펼쳐졌습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;왜 L2점인가?&lt;/h3&gt;
    &lt;p&gt;태양-지구 L2점(지구에서 약 150만 km)은 태양·지구·달이 항상 망원경 뒤편에 있는 특별한 자리입니다.
       이들의 빛이 관측을 방해하지 않아 하늘 전체를 자유롭게 볼 수 있고 온도도 안정적입니다.
       웹b 우주망원경도 이곳에서 관측 중입니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;로만의 능력&lt;/h3&gt;
    &lt;p&gt;주경 지름 2.4m, 광시야 카메라(WFI) 약 3억 화소. 같은 선명도에서 허블 적외선 관측보다
       100배 넓은 하늘을 한 번에 담습니다. 하루 약 11테라비트의 관측 데이터를 지구로 보냅니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;이름의 유래&lt;/h3&gt;
    &lt;p&gt;낸시 그레이스 로만 박사 — NASA 최초의 여성 고위 임원이자 허블 우주망원경 실현의 주역으로,
       허블의 어머니라 불립니다. 우주망원경의 시대를 연 사람의 이름이 이 망원경에 담겼습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;사명&lt;/h3&gt;
    &lt;p&gt;암흑에너지의 정체 밝히기, 중력 미세렌즈로 보이지 않는 외계행성 찾기, 적외선로 은하와 별의
       탄생 지도 그리기. 임무 기간은 최소 5년이며, 우주에서 로봇으로 재급유받을 수 있게 설계되었습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;관측 시작은 언제?&lt;/h3&gt;
    &lt;p&gt;L2 도달과 시운전이 끝나면 본격 관측이 시작되고 첫 이미지가 공개됩니다.
       그때 Adopt a Pixel 신청자에게 픽셀 번호가 배정됩니다. 그날까지 이 지도에서 로만의 여정을 지켜볼 수 있습니다.&lt;/p&gt;
  &lt;/div&gt;
&lt;footer&gt;
  &lt;p&gt;위치 데이터: NASA/JPL Horizons 시스템(천체 번호 -211, 낸시 그레이스 로만 우주망원경), 궤적 출처는 NASA 고다드우주비행센터(GSFC) 비행동역학팀 예측궤적입니다. 교육용 시각화이며 NASA 공식 제품이 아닙니다.&lt;/p&gt;
  &lt;p&gt;시각 표기: 궤적 데이터의 시각(TDB)을 UTC로 근사 환산(오차 약 1분 이내)하여 한국시간(KST)으로 보여줍니다.&lt;/p&gt;
  &lt;p&gt;갱신 방법: 인터넷에 연결된 상태에서 &lt;b&gt;데이터갱신.bat&lt;/b&gt;을 더블클릭하면 NASA의 최신 예측 궤적으로 이 파일의 데이터가 교체됩니다. 갱신 전이라도 내장 데이터 범위(현재: &lt;span id=&quot;srcRange&quot;&gt;—&lt;/span&gt;) 안에서는 정확하게 동작합니다.&lt;/p&gt;
&lt;/footer&gt;

  function tableAt(T, jd){
    var f = (jd - T.t0) / T.dt;
    var fc = clamp(f, 0, T.n - 1);
    var i = Math.min(Math.floor(fc), T.n - 2);

      el(zPredBadge, &quot;text&quot;, { x: 66, y: 58, fill: &quot;#ff9ec1&quot;, &quot;font-size&quot;: 12.5, &quot;text-anchor&quot;: &quot;middle&quot;, &quot;font-weight&quot;: &quot;bold&quot; }, &quot;예측 위치&quot;);

      el(zSvg, &quot;line&quot;, { x1: 24, y1: barY, x2: 24 + barLen, y2: barY, stroke: &quot;#e8ecf8&quot;, &quot;stroke-width&quot;: 2 });

      el(zSvg, &quot;line&quot;, { x1: 24 + barLen, y1: barY - 5, x2: 24 + barLen, y2: barY + 5, stroke: &quot;#e8ecf8&quot;, &quot;stroke-width&quot;: 2 });
      el(zSvg, &quot;text&quot;, { x: 24, y: barY - 10, fill: &quot;#9aa7cc&quot;, &quot;font-size&quot;: 12 }, &quot;50만 km&quot;);

    function zoomRender(jd){
      var nowJ = RT.nowJD();
      var end = RT.range().end;
      var t0 = RT_DATA.R.t0;
      function pts(fromJd, toJd, step){
        var out = [];
        for (var j = fromJd; j &lt;= toJd; j += step){
          var p = RT.projRel(Math.min(j, end));
          out.push((ZCX + p.side*ZSCALE).toFixed(1) + &quot;,&quot; + (ZCY - p.out*ZSCALE).toFixed(1));
        }
        var pe = RT.projRel(Math.min(toJd, end));
        out.push((ZCX + pe.side*ZSCALE).toFixed(1) + &quot;,&quot; + (ZCY - pe.out*ZSCALE).toFixed(1));
        return out.join(&quot; &quot;);
      }
      zTrailPast.setAttribute(&quot;points&quot;, pts(t0, Math.min(jd, end), 1/12));
      zTrailFuture.setAttribute(&quot;points&quot;, jd &lt; end ? pts(Math.min(jd, end), end, 1/6) : &quot;&quot;);
      var pr = RT.projRel(Math.min(jd, end));
      var sx = RT.clamp(ZCX + pr.side*ZSCALE, 8, ZW-8);
      var sy = RT.clamp(ZCY - pr.out*ZSCALE, 8, ZH-8);
      zShip.setAttribute(&quot;cx&quot;, sx.toFixed(1)); zShip.setAttribute(&quot;cy&quot;, sy.toFixed(1));
      zShipLbl.setAttribute(&quot;x&quot;, Math.min(sx + 11, ZW - 40).toFixed(1)); zShipLbl.setAttribute(&quot;y&quot;, Math.max(sy - 9, 16).toFixed(1));
      var pn = RT.projRel(Math.min(nowJ, end));
      zNowDot.setAttribute(&quot;cx&quot;, RT.clamp(ZCX + pn.side*ZSCALE, 8, ZW-8).toFixed(1));
      zNowDot.setAttribute(&quot;cy&quot;, RT.clamp(ZCY - pn.out*ZSCALE, 8, ZH-8).toFixed(1));
      var pred = jd &gt; nowJ + 1/24;
      zPredBadge.setAttribute(&quot;opacity&quot;, pred ? &quot;1&quot; : &quot;0&quot;);
      zTimeTxt.textContent = &quot;표시 시각: &quot; + RT.fmtKST(jd) + (pred ? &quot; (예측)&quot; : &quot;&quot;);
    }

    /* ---------- 태양계 전경 지도 ---------- */

    function solarInit(){
      stars(sSvg, 70, SW, SH, 777);
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: SORBIT, fill: &quot;none&quot;, stroke: &quot;#3a4a86&quot;, &quot;stroke-width&quot;: 1.2, &quot;stroke-dasharray&quot;: &quot;4 6&quot; });
      el(sSvg, &quot;text&quot;, { x: 20, y: SH - 8, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 12 }, &quot;지구 궤도 (1 AU = 약 1억 4,960만 km)&quot;);
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: 18, fill: &quot;#ffd166&quot;, opacity: 0.25 });
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: 11, fill: &quot;#ffcf5c&quot; });
      el(sSvg, &quot;text&quot;, { x: SCX, y: SCY - 28, fill: &quot;#ffcf5c&quot;, &quot;font-size&quot;: 13, &quot;font-weight&quot;: &quot;bold&quot;, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;태양&quot;);
      sRing = el(sSvg, &quot;circle&quot;, { r: 34, fill: &quot;#0b1026&quot;, stroke: &quot;#5a6aa8&quot;, &quot;stroke-width&quot;: 1.2, &quot;stroke-dasharray&quot;: &quot;3 4&quot; });

    function solarRender(jd){
      var e = RT.earthPos(jd);
      var m = Math.sqrt(e[0]*e[0] + e[1]*e[1]);
      var ux = e[0]/m, uy = e[1]/m;
      var ex = SCX + SORBIT*ux, ey = SCY - SORBIT*uy;
      var cx = ex - 46, cy = ey - 40;
      if (cx &lt; 62) { cx = ex + 46; }
      if (cy &lt; 44) { cy = ey + 42; }
      if (cy &gt; SH - 58) { cy = SH - 58; }
      sEarth.setAttribute(&quot;cx&quot;, ex.toFixed(1)); sEarth.setAttribute(&quot;cy&quot;, ey.toFixed(1));
      sEarthLbl.setAttribute(&quot;x&quot;, (ex + 12).toFixed(1)); sEarthLbl.setAttribute(&quot;y&quot;, (ey + 4).toFixed(1));
      sRing.setAttribute(&quot;cx&quot;, cx.toFixed(1)); sRing.setAttribute(&quot;cy&quot;, cy.toFixed(1));
      sCalloutEarth.setAttribute(&quot;cx&quot;, cx.toFixed(1)); sCalloutEarth.setAttribute(&quot;cy&quot;, cy.toFixed(1));
      var pr = RT.projRel(jd);
      var ang = Math.atan2(pr.out, pr.side);
      var shipX = cx - 17*Math.cos(ang), shipY = cy - 17*Math.sin(ang);
      var l2x = cx, l2y = cy - 26;
      sCalloutL2.setAttribute(&quot;cx&quot;, l2x.toFixed(1)); sCalloutL2.setAttribute(&quot;cy&quot;, l2y.toFixed(1));
      sCalloutShip.setAttribute(&quot;cx&quot;, shipX.toFixed(1)); sCalloutShip.setAttribute(&quot;cy&quot;, shipY.toFixed(1));
      sLblL2.setAttribute(&quot;x&quot;, (l2x + 5).toFixed(1)); sLblL2.setAttribute(&quot;y&quot;, (l2y + 3).toFixed(1));
      sLblShip.setAttribute(&quot;x&quot;, (shipX + 5).toFixed(1)); sLblShip.setAttribute(&quot;y&quot;, (shipY + 3).toFixed(1));
      var dx = cx - ex, dy = cy - ey, dl = Math.sqrt(dx*dx + dy*dy) || 1;
      sLink.setAttribute(&quot;x1&quot;, (ex + dx/dl*9).toFixed(1)); sLink.setAttribute(&quot;y1&quot;, (ey + dy/dl*9).toFixed(1));
      sLink.setAttribute(&quot;x2&quot;, (cx - dx/dl*34).toFixed(1)); sLink.setAttribute(&quot;y2&quot;, (cy - dy/dl*34).toFixed(1));
      sZoomRingLbl.setAttribute(&quot;x&quot;, cx.toFixed(1));
      sZoomRingLbl.setAttribute(&quot;y&quot;, (cy + 47).toFixed(1));
    }

    /* ---------- Adopt a Pixel 격자 그림 ---------- */
    function pixelInit(){
      var svg = $(&quot;pixelSvg&quot;);
      var cols = 12, rows = 8, cell = 24, gap = 3, ox = 14, oy = 12;
      var rnd = mulberry32(1024);
      var palette = [&quot;#16204a&quot;, &quot;#1a2a5e&quot;, &quot;#223a7a&quot;, &quot;#2a4a92&quot;, &quot;#1f2f6e&quot;, &quot;#182452&quot;];
      el(svg, &quot;rect&quot;, { x: ox - 6, y: oy - 6, width: cols*(cell+gap) + 8, height: rows*(cell+gap) + 8, rx: 10, fill: &quot;#0d1330&quot;, stroke: &quot;#2a3566&quot; });
      var px = 3, py = 5;
      for (var r = 0; r &lt; rows; r++){
        for (var c = 0; c &lt; cols; c++){
          var x = ox + c*(cell+gap), y = oy + r*(cell+gap);
          var isStar = rnd() &lt; 0.10;
          var fill = isStar ? (rnd() &lt; 0.5 ? &quot;#cfe6ff&quot; : &quot;#ffe9b8&quot;) : palette[Math.floor(rnd()*palette.length)];
          if (r === py &amp;&amp; c === px) fill = &quot;#ffd166&quot;;
          var rect = el(svg, &quot;rect&quot;, { x: x, y: y, width: cell, height: cell, rx: 3, fill: fill, opacity: isStar ? 0.95 : 0.9 });
          if (r === py &amp;&amp; c === px){
            rect.setAttribute(&quot;stroke&quot;, &quot;#ffffff&quot;); rect.setAttribute(&quot;stroke-width&quot;, &quot;2.5&quot;);
            rect.setAttribute(&quot;class&quot;, &quot;pulse&quot;);
            el(svg, &quot;text&quot;, { x: x + cell/2, y: y - 7, fill: &quot;#ffd166&quot;, &quot;font-size&quot;: 12.5, &quot;font-weight&quot;: &quot;bold&quot;, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;내 픽셀&quot;);
          }
        }
      }
      el(svg, &quot;text&quot;, { x: ox - 6 + cols*(cell+gap)/2 + 1, y: oy + rows*(cell+gap) + 24, fill: &quot;#9aa7cc&quot;, &quot;font-size&quot;: 12.5, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;로만의 첫 이미지 (상상 그림) — 각 칸이 픽셀 하나&quot;);
    }

    /* ---------- 전체 렌더 / 시간 모드 ---------- */
    var slider = $(&quot;timeSlider&quot;);
    var mode = &quot;live&quot;;                 // live | scrub | play
    var playTimer = null, liveTimer = null;
    var t0 = RT_DATA.R.t0, tEnd = RT.range().end;
    var curJd = RT.clamp(RT.nowJD(), t0, tEnd);

    function render(jd){
      var m = RT.metrics(jd);
      $(&quot;vDist&quot;).textContent = RT.fmtInt(m.rg);
      $(&quot;sDist&quot;).textContent = &quot;달까지 거리의 약 &quot; + (m.rg/RT.MOON_D).toFixed(1) + &quot;배&quot;;
      $(&quot;vSpeed&quot;).textContent = RT.fmtInt(m.speedKmh);
      $(&quot;sSpeed&quot;).textContent = &quot;(초속 &quot; + m.speedKms.toFixed(2) + &quot; km)&quot;;
      $(&quot;vElapsed&quot;).textContent = RT.fmtElapsed(m.elapsedDays);
      $(&quot;vProg&quot;).textContent = (m.prog*100).toFixed(1);
      $(&quot;progFill&quot;).style.width = (m.prog*100).toFixed(1) + &quot;%&quot;;
      $(&quot;sProg&quot;).textContent = &quot;L2까지 약 &quot; + RT.fmtInt(m.remain) + &quot; km 남음&quot;;
      $(&quot;vLight&quot;).textContent = m.lightSec.toFixed(2);
      $(&quot;sLight&quot;).textContent = &quot;지구-로만 신호 왕복 약 &quot; + (m.lightSec*2).toFixed(1) + &quot;초&quot;;
      zoomRender(jd);
      solarRender(jd);
      $(&quot;tLabel&quot;).textContent = RT.fmtKST(jd);

      $(&quot;tMode&quot;).textContent = mode === &quot;live&quot; ? &quot; · 실시간&quot; : (mode === &quot;play&quot; ? &quot; · 여정 재생&quot; : &quot;&quot;);
      if (mode !== &quot;scrub&quot;){
        slider.value = String(Math.round((jd - t0) / (tEnd - t0) * 1000));
      }
      $(&quot;rangeWarn&quot;).className = &quot;badge warn&quot; + (RT.nowJD() &gt; tEnd ? &quot; on&quot; : &quot;&quot;);
      curJd = jd;
    }

    function stopPlay(){
      if (playTimer){ clearInterval(playTimer); playTimer = null; }
    }
    function setMode(md){
      mode = md;
      if (md !== &quot;play&quot;) stopPlay();
    }

    slider.addEventListener(&quot;input&quot;, function(){
      setMode(&quot;scrub&quot;);
      var v = RT.clamp(parseFloat(slider.value) || 0, 0, 1000);
      render(t0 + (tEnd - t0) * v / 1000);
    });
    $(&quot;btnNow&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;live&quot;);
      render(RT.clamp(RT.nowJD(), t0, tEnd));
    });
    $(&quot;btnStop&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;scrub&quot;);
      render(curJd);
    });
    $(&quot;btnPlay&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;play&quot;);
      var from = t0, to = Math.min(RT.nowJD(), tEnd);
      var startedAt = Date.now(), dur = 24000;
      stopPlay();
      playTimer = setInterval(function(){
        var k = (Date.now() - startedAt) / dur;
        if (k &gt;= 1){
          stopPlay();
          var n = RT.nowJD();
          if (n &lt;= tEnd){ setMode(&quot;live&quot;); render(n); }
          else { setMode(&quot;scrub&quot;); render(to); }
          return;
        }
        render(from + (to - from) * k);
      }, 40);
    });

    liveTimer = setInterval(function(){
      if (mode !== &quot;live&quot;) return;
      render(RT.clamp(RT.nowJD(), t0, tEnd));
    }, 500);

    /* ---------- 픽셀 찾기 (시연용) ---------- */
    var PF_SX = 30, PF_SY = 76, PF_STEP = 54, PF_CELL = 46;   /* 센서 지도 6열 x 3행 */
    var PF_ZX = 420, PF_ZY = 60, PF_ZW = 288;                  /* 검출기 확대 32x32 블록 x 9px */
    var PF_COLS = 6, PF_ROWS = 3, PF_DET = 16777216;

    var pfSenHi, pfBlkHi, pfDot;
    var pfList = [];
    try { pfList = JSON.parse(window.localStorage.getItem(&quot;romanPix_v1&quot;) || &quot;[]&quot;) || []; } catch(e){ pfList = []; }

    function pfInit(){
      var svg = $(&quot;pixMosaic&quot;);
      el(svg, &quot;text&quot;, { x: PF_SX, y: 58, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 13 }, &quot;WFI 검출기 18개 (도식)&quot;);
      el(svg, &quot;text&quot;, { x: PF_ZX, y: 44, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 13 }, &quot;선택한 검출기 확대 (4,096 x 4,096 픽셀)&quot;);
      for (var r = 0; r &lt; PF_ROWS; r++){
        for (var c = 0; c &lt; PF_COLS; c++){
          el(svg, &quot;rect&quot;, { x: PF_SX + c*PF_STEP, y: PF_SY + r*PF_STEP, width: PF_CELL, height: PF_CELL,
            fill: &quot;#111a3f&quot;, stroke: &quot;#2a355f&quot;, rx: 4 });
          el(svg, &quot;text&quot;, { x: PF_SX + c*PF_STEP + PF_CELL/2, y: PF_SY + r*PF_STEP + PF_CELL/2 + 4,
            fill: &quot;#9fb3ff&quot;, &quot;font-size&quot;: 11, &quot;text-anchor&quot;: &quot;middle&quot; }, String(r*PF_COLS + c + 1));
        }
      }
      el(svg, &quot;rect&quot;, { x: PF_ZX, y: PF_ZY, width: PF_ZW, height: PF_ZW, fill: &quot;#0c1128&quot;, stroke: &quot;#2a355f&quot; });
      var zg = el(svg, &quot;g&quot;, { transform: &quot;translate(&quot; + PF_ZX + &quot; &quot; + PF_ZY + &quot;)&quot; });
      for (var k = 1; k &lt; 16; k++){
        el(zg, &quot;line&quot;, { x1: k*18, y1: 0, x2: k*18, y2: PF_ZW, stroke: &quot;#1b2750&quot;, &quot;stroke-width&quot;: 1 });
        el(zg, &quot;line&quot;, { x1: 0, y1: k*18, x2: PF_ZW, y2: k*18, stroke: &quot;#1b2750&quot;, &quot;stroke-width&quot;: 1 });
      }
      stars(zg, 170, PF_ZW, PF_ZW, 4242);
      pfSenHi = el(svg, &quot;rect&quot;, { x: 0, y: 0, width: PF_CELL, height: PF_CELL, fill: &quot;rgba(255,209,102,0.22)&quot;,
        stroke: &quot;#ffd166&quot;, &quot;stroke-width&quot;: 2, rx: 4, opacity: 0 });
      pfBlkHi = el(svg, &quot;rect&quot;, { x: 0, y: 0, width: 9, height: 9, fill: &quot;rgba(255,209,102,0.30)&quot;,
        stroke: &quot;#ffd166&quot;, &quot;stroke-width&quot;: 1.5, opacity: 0 });
      pfDot = el(svg, &quot;circle&quot;, { cx: 0, cy: 0, r: 3, fill: &quot;#ffd166&quot;, stroke: &quot;#ffffff&quot;, &quot;stroke-width&quot;: 1, opacity: 0 });
      el(svg, &quot;text&quot;, { x: PF_SX, y: 392, fill: &quot;#5b6a99&quot;, &quot;font-size&quot;: 11 },
        &quot;왼쪽: 검출기 배치(도식) / 오른쪽: 번호가 가리키는 블록(128 x 128 픽셀)과 픽셀 위치&quot;);

      $(&quot;pixSearch&quot;).addEventListener(&quot;click&quot;, function(){ pfShow(parseInt($(&quot;pixInput&quot;).value, 10)); });
      $(&quot;pixInput&quot;).addEventListener(&quot;keydown&quot;, function(ev){
        if (ev.key === &quot;Enter&quot;) pfShow(parseInt($(&quot;pixInput&quot;).value, 10));
      });
      $(&quot;pixSave&quot;).addEventListener(&quot;click&quot;, function(){
        var n = parseInt($(&quot;pixInput&quot;).value, 10);
        if (!pfShow(n)) return;
        var name = ($(&quot;pixName&quot;).value || &quot;&quot;).trim() || (&quot;픽셀 &quot; + RT.fmtInt(n));
        var found = null;
        for (var i = 0; i &lt; pfList.length; i++){ if (pfList[i].num === n) found = pfList[i]; }
        if (found) found.name = name;
        else pfList.unshift({ name: name, num: n });
        if (pfList.length &gt; 40) pfList.pop();
        pfSaveList();
      });
      pfRenderList();
      if (pfList.length){ $(&quot;pixInput&quot;).value = pfList[0].num; pfShow(pfList[0].num); }
    }

    function pfShow(n){
      var err = &quot;&quot;;
      if (!n || !isFinite(n)) err = &quot;픽셀 번호를 입력하세요. (예: 1297)&quot;;
      else if (n &lt; 1 || n &gt; PF_TOTAL) err = &quot;1 이상 &quot; + RT.fmtInt(PF_TOTAL) + &quot; 이하의 번호를 입력하세요. (WFI 약 3억 픽셀)&quot;;
      if (err){ $(&quot;pixError&quot;).textContent = err; return false; }
      $(&quot;pixError&quot;).textContent = &quot;&quot;;
      var sensor = Math.ceil(n / PF_DET);
      var within = n - (sensor - 1) * PF_DET;
      var row = Math.ceil(within / 4096), col = within - (row - 1) * 4096;
      var sr = Math.floor((sensor - 1) / PF_COLS), sc = (sensor - 1) % PF_COLS;
      pfSenHi.setAttribute(&quot;x&quot;, (PF_SX + sc * PF_STEP).toFixed(1));
      pfSenHi.setAttribute(&quot;y&quot;, (PF_SY + sr * PF_STEP).toFixed(1));

(function(){
  var D = window.ROMAN_DATA, R = D &amp;&amp; D.R ? D.R : null;
  var $ = function(id){ return document.getElementById(id); };
  var L2D = 1496000, MOON_D = 384400, TDB = 69.2, C_KMS = 299792.458;
  var LAUNCH_JD = 2461282.97723;
  var TARGET = Date.UTC(2026, 10, 30, 12) / 86400000 + 2440587.5;
  if (!R || !R.X || !R.X.length){ $(&quot;noData&quot;).style.display = &quot;block&quot;; return; }
  var n = R.n, t0 = R.t0, dt = R.dt, tEnd = t0 + (n - 1) * dt;

  function fmtInt(v){ return Math.round(v).toLocaleString(&quot;ko-KR&quot;); }
  function posAt(jd){
    var f = (jd - t0) / dt;
    f = Math.min(Math.max(f, 0), n - 1);
    var i = Math.min(Math.floor(f), n - 2), r = f - i, j = Math.min(i + 1, n - 1);
    function L(a){ return a[i] + (a[j] - a[i]) * r; }
    return [L(R.X) * 1000, L(R.Y) * 1000, L(R.Z) * 1000];
  }
  function rgAt(jd){ var p = posAt(jd); return Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2]); }
  function fmtKST(jd){
    return new Date((jd - TDB/86400 - 2440587.5) * 86400000).toLocaleString(&quot;ko-KR&quot;,
      {timeZone:&quot;Asia/Seoul&quot;, year:&quot;numeric&quot;, month:&quot;long&quot;, day:&quot;numeric&quot;, weekday:&quot;short&quot;,
       hour:&quot;2-digit&quot;, minute:&quot;2-digit&quot;, hour12:false});

    var rg = rgAt(jd), pct = Math.min(rg / L2D, 1) * 100;

&lt;div class=&quot;ovl on&quot; id=&quot;introOvl&quot;&gt;
  &lt;div class=&quot;ovlCard&quot;&gt;
    &lt;div class=&quot;kick&quot;&gt;OPENING · A JOURNEY TO L2&lt;/div&gt;
    &lt;h2 class=&quot;titleBig&quot;&gt;로만: 어둠 속의 신호&lt;/h2&gt;
    &lt;p&gt;2026년 8월 30일 심야. 플로리다에서 발사된 &lt;b&gt;낸시 그레이스 로만 우주망원경&lt;/b&gt;이
       로켓에서 분리되어, 지구에서 약 150만 km 떨어진 태양-지구 L2점을 향해 홀로 나아갑니다.
       그 순간, 딥 스페이스 네트워크가 7초 주기로 반복되는 &lt;b&gt;발신자 불명의 신호 'SIG-7'&lt;/b&gt;을 수신합니다.&lt;/p&gt;
    &lt;p&gt;당신은 이 여정의 &lt;b&gt;관제 총괄&lt;/b&gt;입니다. 에피소드가 진행될 때마다 나타나는 미션을 해결해
       신호 조각 7개를 모으세요. 모든 조각이 모이면 신호의 정체가 드러납니다.&lt;/p&gt;
    &lt;div class=&quot;roleBox&quot;&gt;
      &lt;b&gt;등장인물&lt;/b&gt; — 당신(관제 총괄) · &lt;b&gt;루미&lt;/b&gt;(로만 탑재 AI 코파일럿) ·
      &lt;b&gt;지상관제&lt;/b&gt;(GSFC 관제팀) · &lt;b&gt;서 박사&lt;/b&gt;(과학 총괄) · &lt;b&gt;시스템&lt;/b&gt;(딥 스페이스 네트워크)
    &lt;/div&gt;
    &lt;ul class=&quot;miniHow&quot;&gt;
      &lt;li&gt;&lt;b&gt;▶ 다음 장면으로&lt;/b&gt; — 다음 에피소드까지 여정을 빠르게 진행합니다&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;자동 비행&lt;/b&gt; — 에피소드마다 자동으로 멈추며 여정이 계속 흐릅니다&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;모든 미션은 클릭만으로&lt;/b&gt; 풀 수 있습니다. 막히면 &lt;b&gt;[힌트]&lt;/b&gt; 버튼! 힌트를 써도 미션은 항상 해결됩니다&lt;/li&gt;
      &lt;li&gt;첫 시도에 힌트 없이 맞히면 별 2개, 그 외에는 별 1개 — 별은 상뿐입니다&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;fine&quot;&gt;※ SIG-7 신호와 등장인물은 이야기를 위한 가상 설정입니다. 궤적과 발사 사실은 NASA 데이터를 따릅니다.
       교육용 시뮬레이션이며 NASA 공식 제품이 아닙니다.&lt;/p&gt;

/* ===== 순수 계산 라이브러리 (DOM 없이 테스트 가능) ===== */
window.RMG = (function(){
  &quot;use strict&quot;;
  var D = window.ROMAN_DATA;
  var L2D = 1496000, MOON_D = 384400, C_KMS = 299792.458, TDB = 69.2;
  var LAUNCH_JD = 2461282.97723;              // 2026-08-30 11:26:04 UTC 발사
  var TARGET_JD = Date.UTC(2026, 10, 30, 12) / 86400000 + 2440587.5; // 2026-11-30 12:00 UTC (NASA 예상 도착)
  var R = null, E = null, t0 = 0, dataEnd = 0;
  var rgEnd = 0, vEnd = 0, sideEnd = 0, outEnd = 0, rem0 = 1, dur = 1, simX = 1;

  function ok(){ return !!(D &amp;&amp; D.R &amp;&amp; D.R.X &amp;&amp; D.R.n &gt; 1 &amp;&amp; D.E &amp;&amp; D.E.X); }
  function clamp(v, a, b){ return v &lt; a ? a : (v &gt; b ? b : v); }
  function at(T, jd){ // 표(T={t0,dt,n,X,Y,Z})의 jd 시각 값 — 좌표 단위 천 km → km
    var f = (jd - T.t0) / T.dt;
    var fc = clamp(f, 0, T.n - 1);
    var i = Math.min(Math.floor(fc), T.n - 2);
    if (i &lt; 0) i = 0;
    var r = fc - i;
    return [ (T.X[i] + (T.X[i+1] - T.X[i]) * r) * 1000,
             (T.Y[i] + (T.Y[i+1] - T.Y[i]) * r) * 1000,
             (T.Z[i] + (T.Z[i+1] - T.Z[i]) * r) * 1000 ];
  }
  function init(){
    if (!ok()) return false;
    R = D.R; E = D.E;
    t0 = R.t0; dataEnd = t0 + R.dt * (R.n - 1);
    rgEnd = rgData(dataEnd); vEnd = speedData(dataEnd);
    var pe = projData(dataEnd); sideEnd = pe.side; outEnd = pe.out;
    rem0 = Math.max(L2D - rgEnd, 1); dur = Math.max(TARGET_JD - dataEnd, 0.001);
    // 데이터 끝 이후: 속도가 v0에서 지수적으로 감속해 정확히 목표일에 L2에 닿는 모델
    var lo = 1e-6, hi = 100;
    for (var k = 0; k &lt; 80; k++){
      var xm = (lo + hi) / 2;
      var got = vEnd * 86400 * dur * (1 - Math.exp(-xm)) / xm;
      if (got &gt; rem0) lo = xm; else hi = xm;
    }
    simX = (lo + hi) / 2;
    return true;
  }
  function relData(jd){ return at(R, jd); }
  function earthData(jd){ return at(E, jd); }
  function rgData(jd){
    var p = relData(jd);
    return Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2]);
  }
  function speedData(jd){
    var h = 1/48, tLast = t0 + R.dt * (R.n - 1);
    var a, b;
    if (jd - h &gt;= t0 - 1e-9 &amp;&amp; jd + h &lt;= tLast + 1e-9){
      a = relData(jd - h); b = relData(jd + h);          // 중앙 차분
    } else if (jd + h &gt; tLast){
      a = relData(jd - 2*h); b = relData(jd);            // 데이터 끝 — 후진 차분 (clamp된 창이 속도를 절반로 재는 것 방지)
    } else {
      a = relData(jd); b = relData(jd + 2*h);            // 데이터 시작 — 전진 차분
    }
    return Math.sqrt((b[0]-a[0])*(b[0]-a[0]) + (b[1]-a[1])*(b[1]-a[1]) + (b[2]-a[2])*(b[2]-a[2])) / (2*h*86400);
  }
  function frame(jd){ // 표시 좌표계: out = 태양 반대방향(L2쪽), side = 궤도 진행 방향
    var e = earthData(jd);
    var m = Math.sqrt(e[0]*e[0] + e[1]*e[1]) || 1;

      side: p[0]*f.px + p[1]*f.py,
      rg:   Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2])

  }
  function simF(u){
    return (Math.exp(-simX * u) - Math.exp(-simX)) / (1 - Math.exp(-simX));
  }
  function rgSim(jd){ return L2D - rem0 * simF(clamp((jd - dataEnd) / dur, 0, 1)); }
  function projSim(jd){ // 데이터 끝 위치에서 L2(0, L2D)까지 남은 비율만큼 직선 접근
    var u = clamp((jd - dataEnd) / dur, 0, 1), f = simF(u);
    return { out: L2D - (L2D - outEnd) * f, side: sideEnd * f, rg: L2D - rem0 * f };
  }
  function inData(jd){ return jd &lt;= dataEnd; }
  function rgAt(jd){ return inData(jd) ? rgData(jd) : rgSim(jd); }
  function projAt(jd){ return inData(jd) ? projData(jd) : projSim(jd); }
  function speedAt(jd){
    if (inData(jd)) return speedData(jd);
    return vEnd * Math.exp(-simX * clamp((jd - dataEnd) / dur, 0, 1));
  }
  function crossRg(th){ // rg가 th를 처음 넘는 시각 (데이터 + 시뮬레이션 전체에서 탐색)
    if (rgAt(t0) &gt;= th || rgAt(TARGET_JD) &lt; th) return null;
    var lo = t0, hi = TARGET_JD;
    for (var k = 0; k &lt; 70; k++){
      var mid = (lo + hi) / 2;
      if (rgAt(mid) &lt; th) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  function nowJD(){ return Date.now() / 86400000 + 2440587.5 + TDB / 86400; }
  function jdToMs(jd){ return (jd - TDB / 86400 - 2440587.5) * 86400000; }
  function fmtKST(jd){
    return new Date(jdToMs(jd)).toLocaleString(&quot;ko-KR&quot;,
      { timeZone:&quot;Asia/Seoul&quot;, year:&quot;numeric&quot;, month:&quot;numeric&quot;, day:&quot;numeric&quot;, hour:&quot;2-digit&quot;, minute:&quot;2-digit&quot;, hour12:false });
  }
  function fmtShort(jd){
    return new Date(jdToMs(jd)).toLocaleString(&quot;ko-KR&quot;,
      { timeZone:&quot;Asia/Seoul&quot;, month:&quot;numeric&quot;, day:&quot;numeric&quot;, hour:&quot;2-digit&quot;, minute:&quot;2-digit&quot;, hour12:false });
  }
  function fmtInt(n){ return Math.round(n).toLocaleString(&quot;ko-KR&quot;); }
  function fmtDplus(jd){
    var d = Math.max(0, jd - LAUNCH_JD);
    return &quot;D+&quot; + (Math.floor(d * 10) / 10).toFixed(1);
  }
  return {
    L2D:L2D, MOON_D:MOON_D, C_KMS:C_KMS, LAUNCH_JD:LAUNCH_JD, TARGET_JD:TARGET_JD,
    ok:ok, init:init,
    t0:function(){ return t0; }, dataEnd:function(){ return dataEnd; },
    rgData:rgData, rgAt:rgAt, projAt:projAt, speedAt:speedAt, crossRg:crossRg,
    nowJD:nowJD, jdToMs:jdToMs, fmtKST:fmtKST, fmtShort:fmtShort, fmtInt:fmtInt, fmtDplus:fmtDplus, clamp:clamp,
    interpRows:function(i){ // 보간 훈련용: i번째와 i+1번째 기록 (r=0.5 정답 포함)
      var j1 = t0 + i * R.dt, j2 = j1 + R.dt;
      var a = rgData(j1), b = rgData(j2);
      return { ti:j1, tj:j2, rgA:a, rgB:b, rgMid:(a + b) / 2 };
    }
  };
})();

&lt;script&gt;
&quot;use strict&quot;;
(function(){
  var RMG = window.RMG;
  var $ = function(id){ return document.getElementById(id); };
  var modalOpen = false;
  var DATA_OK = RMG.ok() &amp;&amp; RMG.init();

  if (!DATA_OK){
    $(&quot;noData&quot;).className = &quot;on&quot;;
    var cons = document.querySelector(&quot;.console&quot;);
    if (cons) cons.style.opacity = &quot;0.35&quot;;
    var bF = $(&quot;bFetched&quot;); if (bF) bF.textContent = &quot;없음&quot;;
    if (location.hash === &quot;#selftest&quot;) selfTestFail(&quot;DATA_MISSING&quot;);
    return;
  }

  var T0 = RMG.t0(), DATA_END = RMG.dataEnd();
  var W = 900, H = 620, CX = 450, EY = 560, TOPY = 50;
  var S = (EY - TOPY) / RMG.L2D;               // px per km
  var canvas = $(&quot;flightMap&quot;), ctx = canvas.getContext(&quot;2d&quot;);
  var FONT = &quot;'Malgun Gothic',sans-serif&quot;;

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed &gt;&gt;&gt; 15, 1 | seed);
      t = t + Math.imul(t ^ t &gt;&gt;&gt; 7, 61 | t) ^ t;
      return ((t ^ t &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
    };
  }
  var starsArr = (function(){
    var rnd = mulberry32(20260930), out = [];
    for (var i = 0; i &lt; 130; i++)
      out.push([3 + rnd() * (W - 6), 3 + rnd() * (H - 6), 0.4 + rnd() * 1.1, 0.12 + rnd() * 0.5]);
    return out;
  })();
  var PATH = (function(){ // 1시간 간격 전체 여정 좌표(미리 계산)
    var n = Math.ceil((RMG.TARGET_JD - T0) * 24) + 1, xs = [], ys = [];
    for (var i = 0; i &lt; n; i++){
      var jd = T0 + i / 24;
      var p = RMG.projAt(jd);
      xs.push(CX + RMG.clamp(p.side, -CX + 12, CX - 12) * S);
      ys.push(EY - RMG.clamp(p.out, 0, RMG.L2D) * S);
    }
    return { xs: xs, ys: ys, n: n };
  })();
  function pathIdx(jd){ return Math.max(0, Math.min(PATH.n - 1, Math.round((jd - T0) * 24))); }

  var RINGS = [
    [RMG.MOON_D, &quot;달 궤도 거리 38.4만 km · 25.7%&quot;, &quot;#3a4a86&quot;],
    [750000, &quot;75만 km · 여정 절반&quot;, &quot;#3a4a86&quot;],
    [1000000, &quot;100만 km · 66.8%&quot;, &quot;#3a4a86&quot;],
    [1122000, &quot;112.2만 km&quot;, &quot;#3a4a86&quot;]
  ];

  function drawStatic(){
    var i, x, y;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = &quot;#05081a&quot;;
    ctx.fillRect(0, 0, W, H);
    for (i = 0; i &lt; starsArr.length; i++){
      ctx.globalAlpha = starsArr[i][3];
      ctx.fillStyle = &quot;#ffffff&quot;;
      ctx.beginPath();
      ctx.arc(starsArr[i][0], starsArr[i][1], starsArr[i][2], 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 태양 방향(지구 아래 화살표 + 바닥 warm glow)
    var grd = ctx.createLinearGradient(0, H - 90, 0, H);
    grd.addColorStop(0, &quot;rgba(255,190,90,0)&quot;);
    grd.addColorStop(1, &quot;rgba(255,170,70,0.16)&quot;);
    ctx.fillStyle = grd;
    ctx.fillRect(0, H - 90, W, 90);
    ctx.strokeStyle = &quot;#ffcf6b&quot;; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(CX, EY + 46); ctx.lineTo(CX, EY + 74); ctx.stroke();
    ctx.fillStyle = &quot;#ffcf6b&quot;;
    ctx.beginPath(); ctx.moveTo(CX - 7, EY + 72); ctx.lineTo(CX + 7, EY + 72); ctx.lineTo(CX, EY + 84); ctx.closePath(); ctx.fill();
    ctx.font = &quot;bold 13px &quot; + FONT; ctx.textAlign = &quot;left&quot;;
    ctx.fillText(&quot;태양 방향&quot;, CX + 14, EY + 76);
    // 거리 링
    for (i = 0; i &lt; RINGS.length; i++){
      var r = RINGS[i][0] * S;
      ctx.strokeStyle = RINGS[i][2]; ctx.lineWidth = 1;
      ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(CX, EY, r, 0, 6.284); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = &quot;#7f8cc0&quot;; ctx.font = &quot;11.5px &quot; + FONT;
      ctx.fillText(RINGS[i][1], CX + 8, EY - r - 5);
    }
    // L2 표시 + 헤일로 궤도
    var l2y = EY - RMG.L2D * S;
    ctx.strokeStyle = &quot;#ff6b9d&quot;; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(CX - 10, l2y - 10); ctx.lineTo(CX + 10, l2y + 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX - 10, l2y + 10); ctx.lineTo(CX + 10, l2y - 10); ctx.stroke();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = &quot;#b98ab0&quot;; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(CX, l2y, 30, 11, 0, 0, 6.284); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = &quot;#ff6b9d&quot;; ctx.font = &quot;bold 13px &quot; + FONT;
    ctx.fillText(&quot;태양-지구 L2점&quot;, CX + 18, l2y + 2);
    ctx.fillStyle = &quot;#c78aa6&quot;; ctx.font = &quot;11.5px &quot; + FONT;
    ctx.fillText(&quot;로만의 최종 관측 자리 (헤일로 궤도)&quot;, CX + 18, l2y + 18);
    // 지구
    var eg = ctx.createRadialGradient(CX - 4, EY - 4, 2, CX, EY, 12);
    eg.addColorStop(0, &quot;#9fd4ff&quot;); eg.addColorStop(0.55, &quot;#3f7fd6&quot;); eg.addColorStop(1, &quot;#123a75&quot;);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(CX, EY, 11, 0, 6.284); ctx.fill();
    ctx.strokeStyle = &quot;#bcd8ff&quot;; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, EY, 11, 0, 6.284); ctx.stroke();
    ctx.fillStyle = &quot;#bcd8ff&quot;; ctx.font = &quot;bold 13px &quot; + FONT;
    ctx.fillText(&quot;지구&quot;, CX + 15, EY - 12);
    // 예측 궤적(점선 전체)
    ctx.strokeStyle = &quot;#8f9bd0&quot;; ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 7]); ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(PATH.xs[0], PATH.ys[0]);
    for (i = 1; i &lt; PATH.n; i++) ctx.lineTo(PATH.xs[i], PATH.ys[i]);
    ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  function drawMoon(jd){
    var ang = (jd - T0) * 6.283185 / 27.3217 + 2.1;
    var r = RMG.MOON_D * S;
    var x = CX + Math.cos(ang) * r, y = EY + Math.sin(ang) * r;
    ctx.fillStyle = &quot;#c8cbe0&quot;;
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.284); ctx.fill();
    ctx.strokeStyle = &quot;#5a5f85&quot;; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.284); ctx.stroke();
    ctx.fillStyle = &quot;#9aa2c8&quot;; ctx.font = &quot;11px &quot; + FONT;
    ctx.fillText(&quot;달&quot;, x + 7, y + 4);
  }

  function drawDyn(jd){
    var i, idx = pathIdx(jd);
    // 지나온 길(금색 실선)
    ctx.strokeStyle = &quot;#ffd166&quot;; ctx.lineWidth = 3;
    ctx.lineJoin = &quot;round&quot;; ctx.lineCap = &quot;round&quot;;
    ctx.beginPath();
    ctx.moveTo(PATH.xs[0], PATH.ys[0]);
    for (i = 1; i &lt;= idx; i++) ctx.lineTo(PATH.xs[i], PATH.ys[i]);
    ctx.stroke();
    drawMoon(jd);
    // 오늘의 실제 위치
    var nowJ = RMG.nowJD();
    if (nowJ &gt;= T0 &amp;&amp; nowJ &lt;= DATA_END){
      var pn = RMG.projAt(nowJ);
      var nx = CX + pn.side * S, ny = EY - pn.out * S;
      ctx.fillStyle = &quot;#ffffff&quot;;
      ctx.beginPath(); ctx.arc(nx, ny, 3.2, 0, 6.284); ctx.fill();
      ctx.fillStyle = &quot;#e8ecf8&quot;; ctx.font = &quot;11px &quot; + FONT;
      ctx.fillText(&quot;오늘&quot;, nx + 6, ny - 6);
    }
    // 로만
    var sx = PATH.xs[idx], sy = PATH.ys[idx];
    if (G.arrived){
      var t = (Date.now() - G.arrivedAt) / 1000;
      var ha = t * 0.9;
      sx = CX + Math.cos(ha) * 30;               // 헤일로 궤도 시각화(장축 30px)
      sy = (EY - RMG.L2D * S) + Math.sin(ha) * 11;
    }
    ctx.save();
    ctx.shadowColor = &quot;#ffd166&quot;; ctx.shadowBlur = 12;
    ctx.fillStyle = &quot;#ffd166&quot;;
    ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 6.284); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = &quot;#ffffff&quot;; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 6.284); ctx.stroke();
    ctx.fillStyle = &quot;#ffd166&quot;; ctx.font = &quot;bold 13px &quot; + FONT;
    ctx.fillText(&quot;로만&quot;, Math.min(sx + 11, W - 42), Math.max(sy - 9, 16));
    // 예측 비행 표시
    if (jd &gt; DATA_END){
      ctx.fillStyle = &quot;#ff9ec1&quot;; ctx.font = &quot;bold 12.5px &quot; + FONT;
      ctx.fillText(&quot;예측 비행 중 (데이터 범위 밖 — 학습용 모델)&quot;, 16, 56);
    }
  }

  /* ---------- 시간 진행(애니메이션)과 메인 루프 ---------- */
  function animTo(target, cb){
    var from = G.jd;
    var span = Math.max(target - from, 1 / 24);
    var durMs = RMG.clamp(420 + span * 46, 550, 2600);
    G.anim = { from: from, to: target, start: performance.now(), durMs: durMs, cb: cb };
  }
  var DAYS_PER_SEC = 0.45;
  var lastTs = 0;
  function loop(ts){
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 0;
    lastTs = ts;
    if (G.anim){
      var a = G.anim;
      var u = RMG.clamp((ts - a.start) / a.durMs, 0, 1);
      var e = u &lt; 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      G.jd = a.from + (a.to - a.from) * e;
      if (u &gt;= 1){
        G.jd = a.to;
        G.anim = null;
        if (a.cb) a.cb();
      }
    } else if (G.auto &amp;&amp; !modalOpen &amp;&amp; !G.arrived &amp;&amp; EVENTS[G.evIdx]){
      var target = EVENTS[G.evIdx].jd;
      G.jd = Math.min(G.jd + DAYS_PER_SEC * dt, target);
      if (G.jd &gt;= target) processEvent();
    }
    if (G.jd &gt; RMG.TARGET_JD) G.jd = RMG.TARGET_JD;
    updateHUD();
    render();
    requestAnimationFrame(loop);
  }

      { id:&quot;LOG112&quot;, jd:RMG.crossRg(1122000), kind:&quot;radio&quot;, label:&quot;112.2만 km 통과&quot;, lines:[

      { id:&quot;E7&quot;, jd:T0 + 78, kind:&quot;task&quot;, ep:7, label:&quot;EP7 · 첫 빛의 절차&quot;, build:taskE7 },
      { id:&quot;ARRIVE&quot;, jd:RMG.TARGET_JD, kind:&quot;arrive&quot;, ep:0, label:&quot;최종 장면 · L2 도착&quot; }
    ];
    EVENTS.sort(function(a, b){ return a.jd - b.jd; });

  function processEvent(){
    var ev = EVENTS[G.evIdx];
    if (!ev) return;
    G.jd = ev.jd;
    if (ev.kind === &quot;radio&quot;){
      for (var i = 0; i &lt; ev.lines.length; i++)
        addComms(SPEAK[ev.lines[i].who], ev.lines[i].t);
      G.evIdx++;
      updateHUD();
    } else if (ev.kind === &quot;task&quot;){
      addComms(SPEAK.sys, &quot;&lt;b&gt;&quot; + ev.label + &quot;&lt;/b&gt; — 에피소드 미션이 도착했습니다&quot;);
      openTask(ev);
    } else if (ev.kind === &quot;arrive&quot;){
      onArrive();
    }
  }

  /* ---------- 과제 유형 1: 선택 (오답 소거 힌트 + 2회 오답 시 자동 힌트) ---------- */
  function choiceTask(card, cfg, done){
    var q = document.createElement(&quot;div&quot;);
    q.className = &quot;taskQ&quot;; q.textContent = cfg.q;
    card.appendChild(q);
    if (cfg.sub){ var s = document.createElement(&quot;div&quot;); s.className = &quot;taskSub&quot;; s.textContent = cfg.sub; card.appendChild(s); }
    var firstTry = true, hintUsed = false, solved = false, wrongs = 0;
    var fb = null, hb = null, hBox = null, btns = [];
    function hintNudge(){
      hintUsed = true;
      var target = null;
      btns.forEach(function(b){
        if (b.dataset.ok !== &quot;1&quot; &amp;&amp; !target &amp;&amp;
            !b.classList.contains(&quot;dim&quot;) &amp;&amp; !b.classList.contains(&quot;bad&quot;)) target = b;
      });
      if (target) target.classList.add(&quot;dim&quot;);
      else if (cfg.hint){
        if (!hBox){
          hBox = document.createElement(&quot;div&quot;);
          hBox.className = &quot;hintBox&quot;;
          card.insertBefore(hBox, fb);
        }
        hBox.textContent = cfg.hint;
      }
      if (hb) hb.disabled = !btns.some(function(b){
        return b.dataset.ok !== &quot;1&quot; &amp;&amp; !b.classList.contains(&quot;dim&quot;) &amp;&amp; !b.classList.contains(&quot;bad&quot;);
      });
    }
    if (cfg.hint || cfg.opts.filter(function(o){ return !o.ok; }).length &gt; 1)
      hb = hintBar(card, hintNudge);
    cfg.opts.forEach(function(o){
      var b = document.createElement(&quot;button&quot;);
      b.type = &quot;button&quot;; b.className = &quot;optBtn&quot;; b.textContent = o.t;
      b.dataset.ok = o.ok ? &quot;1&quot; : &quot;0&quot;;
      b.addEventListener(&quot;click&quot;, function(){
        if (solved) return;
        if (o.ok){
          solved = true;
          b.className = &quot;optBtn ok&quot;;
          btns.forEach(function(b2){ if (b2 !== b &amp;&amp; b2.dataset.ok !== &quot;1&quot;) b2.classList.add(&quot;dim&quot;); });
          fb.className = &quot;fb ok&quot;;
          fb.innerHTML = cfg.expl + '&lt;div class=&quot;starRow&quot;&gt;' + starHtml(firstTry, hintUsed) + &quot;&lt;/div&gt;&quot;;
          doneBar(card, function(){ done(firstTry &amp;&amp; !hintUsed ? 2 : 1); });
        } else {
          b.classList.add(&quot;bad&quot;);
          fb.className = &quot;fb bad&quot;;
          fb.innerHTML = &quot;다시 생각해 보세요 — &quot; + o.hint;
          firstTry = false;
          wrongs++;
          if (wrongs === 2) hintNudge();   // 2번 틀리면 자동 힌트 — 절대 막히지 않게
        }
      });
      card.appendChild(b);
      btns.push(b);
    });
    fb = document.createElement(&quot;div&quot;);
    fb.className = &quot;fb&quot;; card.appendChild(fb);
  }
  /* ---------- 과제 유형 2: 순서 (다음 단계 발광 힌트) ---------- */
  function seqTask(card, cfg, done){
    var q = document.createElement(&quot;div&quot;);

  /* JPEG 데이터를 그대로 담는 1페이지 PDF 생성 — 외부 라이브러리 없이 오프라인 동작.
     반환값은 latin1 바이너리 문자열(각 charCode가 1바이트). */
  function makePdf(jpegDataUrl, w, h){
    var PW = 842, PH = 595; // A4 가로(pt)
    var bin = atob(jpegDataUrl.split(&quot;,&quot;)[1]);
    var cs = &quot;q &quot; + PW + &quot; 0 0 &quot; + PH + &quot; 0 0 cm /Im0 Do Q&quot;;
    var objs = [
      &quot;&lt;&lt;/Type/Catalog/Pages 2 0 R&gt;&gt;&quot;,
      &quot;&lt;&lt;/Type/Pages/Kids[3 0 R]/Count 1&gt;&gt;&quot;,
      &quot;&lt;&lt;/Type/Page/Parent 2 0 R/MediaBox[0 0 &quot; + PW + &quot; &quot; + PH + &quot;]&quot; +
        &quot;/Resources&lt;&lt;/XObject&lt;&lt;/Im0 4 0 R&gt;&gt;/ProcSet[/PDF/ImageC]&gt;&gt;/Contents 5 0 R&gt;&gt;&quot;,
      &quot;&lt;&lt;/Type/XObject/Subtype/Image/Width &quot; + w + &quot;/Height &quot; + h +
        &quot;/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length &quot; + bin.length +
        &quot;&gt;&gt;\nstream\n&quot; + bin + &quot;\nendstream&quot;,
      &quot;&lt;&lt;/Length &quot; + cs.length + &quot;&gt;&gt;\nstream\n&quot; + cs + &quot;\nendstream&quot;
    ];
    var out = &quot;%PDF-1.4\n&quot;, offs = [];
    for (var i = 0; i &lt; objs.length; i++){
      offs.push(out.length);
      out += (i + 1) + &quot; 0 obj\n&quot; + objs[i] + &quot;\nendobj\n&quot;;
    }
    var xrefPos = out.length;
    out += &quot;xref\n0 &quot; + (objs.length + 1) + &quot;\n0000000000 65535 f \n&quot;;
    for (var j = 0; j &lt; offs.length; j++)
      out += (&quot;0000000000&quot; + offs[j]).slice(-10) + &quot; 00000 n \n&quot;;
    out += &quot;trailer\n&lt;&lt;/Size &quot; + (objs.length + 1) + &quot;/Root 1 0 R&gt;&gt;\nstartxref\n&quot; + xrefPos + &quot;\n%%EOF&quot;;
    return out;
  }
  function downloadData(href, filename){
    var a = document.createElement(&quot;a&quot;);
    a.href = href;
    a.download = filename;
    if (!window.__CINE.skipDownload){
      document.body.appendChild(a);
      a.click();
      if (a.remove) a.remove(); else document.body.removeChild(a);
    }
  }
  function saveCert(kind){
    var fb = $(&quot;saveFb&quot;);
    var nm = $(&quot;inName&quot;).value.trim();
    if (!nm){
      fb.innerHTML = '&lt;span style=&quot;color:#ff8f8f&quot;&gt;이름을 입력하세요 — 수료증에 표시됩니다.&lt;/span&gt;';
      return false;
    }
    var r = drawCert();
    if (kind === &quot;pdf&quot;){
      var bin = makePdf(r.cv.toDataURL(&quot;image/jpeg&quot;, 0.92), r.cv.width, r.cv.height);
      downloadData(&quot;data:application/pdf;base64,&quot; + btoa(bin), &quot;로만시뮬레이션_수료증_&quot; + nm + &quot;.pdf&quot;);
      fb.innerHTML = '&lt;span style=&quot;color:#9fe6a0&quot;&gt;PDF 저장 완료 — 다운로드 폴더에서 확인하세요.&lt;/span&gt;';
      window.__CINE.lastPdf = { name: nm, len: bin.length };
      return true;
    }
    var data = r.cv.toDataURL(&quot;image/png&quot;);
    downloadData(data, &quot;로만시뮬레이션_수료증_&quot; + nm + &quot;.png&quot;);
    fb.innerHTML = '&lt;span style=&quot;color:#9fe6a0&quot;&gt;PNG 저장 완료 — 다운로드 폴더에서 확인하세요.&lt;/span&gt;';
    window.__CINE.lastCert = { name: nm, len: data.length };
    return true;
  }
  window.__CINE = { drawCert: drawCert, saveCert: saveCert, makePdf: makePdf, openSave: openSave, closeSave: closeSave };
  $(&quot;btnPng&quot;).addEventListener(&quot;click&quot;, function(){ saveCert(&quot;png&quot;); });
  $(&quot;btnPdf&quot;).addEventListener(&quot;click&quot;, function(){ saveCert(&quot;pdf&quot;); });
  $(&quot;btnSaveCancel&quot;).addEventListener(&quot;click&quot;, closeSave);

  /* ---------- 상태 · 리셋 · 부팅 ---------- */
  var G = null;
  function newState(){
    return {
      jd: T0, evIdx: 0, stars: 0, frags: 0, fragDone: {}, phaseDone: {},
      auto: false, arrived: false, arrivedAt: 0, anim: null
    };
  }
  function setAuto(on){
    G.auto = on;
    $(&quot;btnAuto&quot;).textContent = on ? &quot;자동 비행 중 (클릭→정지)&quot; : &quot;자동 비행&quot;;
  }
  function resetGame(){
    G = newState();
    $(&quot;log&quot;).innerHTML = &quot;&quot;;
    $(&quot;endOvl&quot;).className = &quot;ovl&quot;;
    $(&quot;taskOvl&quot;).className = &quot;ovl&quot;;
    $(&quot;saveOvl&quot;).className = &quot;ovl&quot;;
    modalOpen = false;
    $(&quot;btnAuto&quot;).textContent = &quot;자동 비행&quot;;
    updatePhases();
    addComms(SPEAK.sys, &quot;관제 준비 완료 — &lt;b&gt;▶ 다음 장면으로&lt;/b&gt;를 누르면 여정이 시작됩니다.&quot;);
    updateHUD();
  }
  function startJourney(){
    addComms(SPEAK.you, &quot;전원 인가 절차 확인. 로만 우주망원경 — L2를 향한 여정을 시작합니다.&quot;);
    if (EVENTS[G.evIdx] &amp;&amp; EVENTS[G.evIdx].jd &gt; G.jd) animTo(EVENTS[G.evIdx].jd, processEvent);
    else processEvent();
  }
  function boot(){
    G = newState();
    buildEvents();
    $(&quot;bFetched&quot;).textContent = (window.ROMAN_DATA &amp;&amp; window.ROMAN_DATA.fetched) || &quot;—&quot;;
    $(&quot;bRange&quot;).textContent = RMG.fmtShort(T0).split(&quot; &quot;).slice(0, 2).join(&quot; &quot;) + &quot; ~ &quot; +
      RMG.fmtShort(DATA_END).split(&quot; &quot;).slice(0, 2).join(&quot; &quot;);
    updatePhases();
    addComms(SPEAK.sys, &quot;관제 준비 완료 — &lt;b&gt;▶ 다음 장면으로&lt;/b&gt;를 누르면 여정이 시작됩니다.&quot;);
    $(&quot;btnStart&quot;).addEventListener(&quot;click&quot;, function(){
      $(&quot;introOvl&quot;).className = &quot;ovl&quot;;
      startJourney();
    });
    $(&quot;btnAdv&quot;).addEventListener(&quot;click&quot;, function(){
      if (modalOpen || G.anim || G.arrived || !EVENTS[G.evIdx]) return;
      animTo(EVENTS[G.evIdx].jd, processEvent);
    });
    $(&quot;btnAuto&quot;).addEventListener(&quot;click&quot;, function(){ setAuto(!G.auto); });
    $(&quot;btnReset&quot;).addEventListener(&quot;click&quot;, resetGame);
    requestAnimationFrame(loop);
    if (location.hash === &quot;#selftest&quot;) setTimeout(runSelfTest, 60);
    if (location.hash === &quot;#pdfprobe&quot;){
      // 진단: 샘플 학생(6학년 2반 15번 김로만) 수료증 PDF 생성 → 다운로드 + base64 덤프(자동 검증용)
      for (var pi = 0; pi &lt; 7; pi++) G.phaseDone[pi] = 2;
      G.phaseDone[7] = 0; G.stars = 14; G.frags = 7; updatePhases();
      $(&quot;inGrade&quot;).value = &quot;6&quot;; $(&quot;inClass&quot;).value = &quot;2&quot;; $(&quot;inNum&quot;).value = &quot;15&quot;; $(&quot;inName&quot;).value = &quot;김로만&quot;;
      var isHeadless = navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent);
      if (isHeadless) window.__CINE.skipDownload = true;
      saveCert(&quot;pdf&quot;);
      var pr = drawCert();
      var pbin = makePdf(pr.cv.toDataURL(&quot;image/jpeg&quot;, 0.92), pr.cv.width, pr.cv.height);
      var pbox = $(&quot;selftestOut&quot;);
      if (pbox){ pbox.className = &quot;on&quot;; pbox.textContent = &quot;PDFB64:&quot; + btoa(pbin); }
    }
  }

  /* ---------- 셀프테스트 (열 때 #selftest 해시 사용) ---------- */
  function selfTestFail(msg){
    var box = $(&quot;selftestOut&quot;);
    if (box){ box.className = &quot;on&quot;; box.textContent = &quot;BOOT FAIL: &quot; + msg; }
  }
  function runSelfTest(){
    var lines = [];
    function chk(name, cond){ lines.push((cond ? &quot;PASS &quot; : &quot;FAIL &quot;) + name); }
    try {
      chk(&quot;data present&quot;, DATA_OK);
      chk(&quot;rg(T0) ~7345km&quot;, Math.abs(RMG.rgAt(T0) - 7345) &lt; 500);
      var cMoon = RMG.crossRg(RMG.MOON_D);
      chk(&quot;crossRg(moon) in D+0~4&quot;, !!cMoon &amp;&amp; cMoon &gt; T0 &amp;&amp; cMoon &lt; T0 + 4);
      chk(&quot;rg(crossMoon) ~384400km&quot;, !!cMoon &amp;&amp; Math.abs(RMG.rgAt(cMoon) - RMG.MOON_D) &lt; 5);
      chk(&quot;seam rg continuity&quot;, RMG.rgAt(DATA_END - 0.04) &lt;= RMG.rgAt(DATA_END) &amp;&amp;
        RMG.rgAt(DATA_END) &lt;= RMG.rgAt(DATA_END + 0.04));
      chk(&quot;seam speed continuity&quot;, Math.abs(RMG.speedAt(DATA_END - 0.01) - RMG.speedAt(DATA_END + 0.01)) &lt;
        RMG.speedAt(DATA_END) * 0.06);
      chk(&quot;arrive ~L2D&quot;, RMG.rgAt(RMG.TARGET_JD) &gt;= RMG.L2D - 1);
      chk(&quot;11 events sorted&quot;, EVENTS.length === 11 &amp;&amp; EVENTS.every(function(e, i){
        return e.jd !== null &amp;&amp; e.jd &gt;= T0 - 0.001 &amp;&amp; e.jd &lt;= RMG.TARGET_JD + 0.001 &amp;&amp;
          (i === 0 || EVENTS[i - 1].jd &lt;= e.jd);
      }));
      chk(&quot;events have 7 tasks&quot;, EVENTS.filter(function(e){ return e.kind === &quot;task&quot;; }).length === 7);
      chk(&quot;fmtKST(T0) has 8. 30.&quot;, RMG.fmtKST(T0).indexOf(&quot;8. 30.&quot;) &gt;= 0);
      chk(&quot;path points &gt;= 2200&quot;, PATH.n &gt;= 2200);
      chk(&quot;8 phases&quot;, PHASES.length === 8);
      // UI 스모크 — 과제 7종을 실제 클릭으로 통과 (힌트 사용 분기 포함)
      (function(){
        function clickContinue(c){
          var bs = c.querySelectorAll(&quot;.taskFoot button&quot;);
          bs[bs.length - 1].click();
        }
        function runChoice(builder, wrongFirst, hintFirst){
          var c = document.createElement(&quot;div&quot;), got = null;
          builder(c, function(s){ got = s; });
          if (hintFirst){ var hb = c.querySelector(&quot;.hintBtn&quot;); if (hb) hb.click(); }
          var bs = c.querySelectorAll(&quot;.optBtn&quot;);
          var okBtn = Array.prototype.filter.call(bs, function(b){ return b.dataset.ok === &quot;1&quot;; })[0];
          var badBtn = Array.prototype.filter.call(bs, function(b){ return b.dataset.ok !== &quot;1&quot;; })[0];
          if (wrongFirst &amp;&amp; badBtn) badBtn.click();
          if (okBtn) okBtn.click();
          clickContinue(c);
          return got;
        }
        chk(&quot;UI choice E3 ★★&quot;, runChoice(taskE3, false, false) === 2);
        chk(&quot;UI choice E3 retry ★&quot;, runChoice(taskE3, true, false) === 1);
        chk(&quot;UI choice E3 hint ★&quot;, runChoice(taskE3, false, true) === 1);
        chk(&quot;UI choice E2 ★★&quot;, runChoice(taskE2, false, false) === 2);
        chk(&quot;UI choice E5 ★★&quot;, runChoice(taskE5, false, false) === 2);
        chk(&quot;UI choice E6 ★★&quot;, runChoice(taskE6, false, false) === 2);
        function runSeq(builder, hintFirst){
          var c = document.createElement(&quot;div&quot;), got = null;
          builder(c, function(s){ got = s; });
          if (hintFirst){ var hb = c.querySelector(&quot;.hintBtn&quot;); if (hb) hb.click(); }
          Array.prototype.slice.call(c.querySelectorAll(&quot;.seqItem&quot;))
            .sort(function(a, b){ return (+a.dataset.ok) - (+b.dataset.ok); })
            .forEach(function(b){ b.click(); });
          submitBtn(c).click();
          clickContinue(c);
          return got;
        }
        chk(&quot;UI seq E1 ★★&quot;, runSeq(taskE1, false) === 2);
        chk(&quot;UI seq E1 hint ★&quot;, runSeq(taskE1, true) === 1);
        chk(&quot;UI seq E7 ★★&quot;, runSeq(taskE7, false) === 2);
        function runChk(builder, hintFirst){
          var c = document.createElement(&quot;div&quot;), got = null;
          builder(c, function(s){ got = s; });
          if (hintFirst){ var hb = c.querySelector(&quot;.hintBtn&quot;); if (hb) hb.click(); }
          c.querySelectorAll(&quot;.chkRow&quot;).forEach(function(r){
            if (r.dataset.ok === &quot;1&quot;) r.querySelector(&quot;input&quot;).checked = true;
          });
          submitBtn(c).click();
          clickContinue(c);
          return got;
        }
        chk(&quot;UI chk E4 ★★&quot;, runChk(taskE4, false) === 2);
        chk(&quot;UI chk E4 hint ★&quot;, runChk(taskE4, true) === 1);
        // 쉬움 보장: 전 과제 힌트 버튼 + 클릭만으로 해결(숫자 입력 없음) + 2회 오답 시 자동 힌트
        var ALLB = [taskE1, taskE2, taskE3, taskE4, taskE5, taskE6, taskE7];
        chk(&quot;hint btn in all 7&quot;, ALLB.every(function(bu){
          var c = document.createElement(&quot;div&quot;); bu(c, function(){});
          return !!c.querySelector(&quot;.hintBtn&quot;);
        }));
        chk(&quot;no number inputs (all-click)&quot;, ALLB.every(function(bu){
          var c = document.createElement(&quot;div&quot;); bu(c, function(){});
          return !c.querySelector(&quot;input[type=number]&quot;);
        }));
        chk(&quot;autohint dims after 2 wrongs&quot;, (function(){
          var c = document.createElement(&quot;div&quot;); taskE2(c, function(){});
          var wrongs = Array.prototype.filter.call(c.querySelectorAll(&quot;.optBtn&quot;),
            function(b){ return b.dataset.ok !== &quot;1&quot;; });
          wrongs[0].click(); wrongs[1].click();
          return c.querySelectorAll(&quot;.optBtn.dim&quot;).length &gt;= 1;
        })());
      })();
      // 흐름 스모크 — 이벤트 진행 → 7개 에피소드 → 도착 → 엔딩 → 리셋
      (function(){
        var savedG = G;
        G = newState();
        modalOpen = false;
        var guard = 0, solved = 0;
        function solveTask(ev){
          var c = $(&quot;taskCard&quot;);
          if (ev.ep === 1 || ev.ep === 7){
            Array.prototype.slice.call(c.querySelectorAll(&quot;.seqItem&quot;))
              .sort(function(a, b){ return (+a.dataset.ok) - (+b.dataset.ok); })
              .forEach(function(b){ b.click(); });
            submitBtn(c).click();
          } else if (ev.ep === 4){
            c.querySelectorAll(&quot;.chkRow&quot;).forEach(function(r){
              if (r.dataset.ok === &quot;1&quot;) r.querySelector(&quot;input&quot;).checked = true;
            });
            submitBtn(c).click();
          } else {
            var bs = c.querySelectorAll(&quot;.optBtn&quot;);
            var okBtn = Array.prototype.filter.call(bs, function(b){ return b.dataset.ok === &quot;1&quot;; })[0];
            if (okBtn) okBtn.click();
          }
          var bsAll = c.querySelectorAll(&quot;.taskFoot button&quot;);
          bsAll[bsAll.length - 1].click(); // [다음 장면 ▶]
          chk(&quot;flow close &quot; + ev.id, modalOpen === false &amp;&amp; $(&quot;taskOvl&quot;).className === &quot;ovl&quot; &amp;&amp;
            G.evIdx === EVENTS.indexOf(ev) + 1);
        }
        while (G.evIdx &lt; EVENTS.length &amp;&amp; guard++ &lt; 50){
          var ev = EVENTS[G.evIdx];
          G.jd = Math.max(G.jd, ev.jd);
          if (ev.kind === &quot;task&quot;){
            openTask(ev);
            solveTask(ev);
            solved++;
          } else if (ev.kind === &quot;radio&quot;){
            processEvent();
          } else {
            onArrive();
            showEnding();
          }
        }
        chk(&quot;flow 7 tasks solved&quot;, solved === 7);
        chk(&quot;flow 7 frags gathered&quot;, G.frags === 7);
        chk(&quot;flow arrived + 14 stars&quot;, G.arrived === true &amp;&amp; G.stars === 14);
        chk(&quot;flow ending built&quot;, !!$(&quot;endCard&quot;).querySelector(&quot;.rankBig&quot;));
        chk(&quot;flow senderBox shown&quot;, !!$(&quot;endCard&quot;).querySelector(&quot;.senderBox&quot;));
        chk(&quot;flow rank 전설&quot;, rankOf(14) === &quot;전설의 관제 총괄&quot;);
        // 수료증 저장 스모크 — 저장 시에만 학년/반/번호/이름 입력 → PNG / PDF(인쇄)
        window.__CINE.skipDownload = true; // 헤드리스 가상시간에서 실제 다운로드 방지
        $(&quot;endCard&quot;).querySelectorAll(&quot;.taskFoot button&quot;)[0].click();
        chk(&quot;save modal opens&quot;, $(&quot;saveOvl&quot;).className === &quot;ovl on&quot; &amp;&amp;
          !!$(&quot;inGrade&quot;) &amp;&amp; !!$(&quot;inClass&quot;) &amp;&amp; !!$(&quot;inNum&quot;) &amp;&amp; !!$(&quot;inName&quot;));
        $(&quot;btnPng&quot;).click();
        chk(&quot;png blocked without name&quot;, $(&quot;saveFb&quot;).textContent.indexOf(&quot;이름&quot;) &gt;= 0 &amp;&amp; !window.__CINE.lastCert);
        $(&quot;inGrade&quot;).value = &quot;6&quot;; $(&quot;inClass&quot;).value = &quot;2&quot;; $(&quot;inNum&quot;).value = &quot;15&quot;; $(&quot;inName&quot;).value = &quot;김로만&quot;;
        $(&quot;btnPng&quot;).click();
        chk(&quot;png saved (name+bytes)&quot;, !!window.__CINE.lastCert &amp;&amp; window.__CINE.lastCert.name === &quot;김로만&quot; &amp;&amp;
          window.__CINE.lastCert.len &gt; 1000);
        $(&quot;btnPdf&quot;).click();
        chk(&quot;pdf built (name+bytes)&quot;, !!window.__CINE.lastPdf &amp;&amp; window.__CINE.lastPdf.name === &quot;김로만&quot; &amp;&amp;
          window.__CINE.lastPdf.len &gt; 1000);
        $(&quot;btnSaveCancel&quot;).click();
        chk(&quot;save modal closes&quot;, $(&quot;saveOvl&quot;).className === &quot;ovl&quot;);
        resetGame();
        chk(&quot;flow reset clean&quot;, G.stars === 0 &amp;&amp; G.frags === 0 &amp;&amp; G.evIdx === 0 &amp;&amp;
          $(&quot;log&quot;).children.length === 1 &amp;&amp; $(&quot;endOvl&quot;).className === &quot;ovl&quot; &amp;&amp; $(&quot;taskOvl&quot;).className === &quot;ovl&quot;);
        G = savedG;
        modalOpen = false;
        updatePhases();
      })();
    } catch(e){
      lines.push(&quot;FAIL exception: &quot; + (e &amp;&amp; e.message));
    }
    lines.push(&quot;SUMMARY: &quot; + lines.filter(function(l){ return l.indexOf(&quot;FAIL&quot;) === 0; }).length + &quot; fail&quot;);
    var box = $(&quot;selftestOut&quot;);
    if (box){ box.className = &quot;on&quot;; box.textContent = lines.join(&quot;\n&quot;); }
  }

  boot();
})();
&lt;/script&gt;
