<!DOCTYPE html>
<!-- PROJECT ROMAN 단일 배포판 — 단일배포_빌드.js로 생성. 원본 페이지 수정 후 재생성할 것. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT ROMAN — 로만 우주망원경 통합 화면</title>
<style>
  :root{--bg:#0b1026;--card:#131a33;--line:#2a355f;--txt:#e8ecf8;--sub:#9aa7cc;--gold:#ffd166;--cyan:#6ee7ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{padding:14px 18px 0}
  h1{margin:0;font-size:24px;letter-spacing:-0.3px}
  h1 .accent{color:var(--gold)}
  .sub{margin:6px 0 0;font-size:13.5px;color:var(--sub)}
  .byline{margin:4px 0 0;font-size:11px;color:var(--sub);text-align:right}
  .tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
  .tabs button{font-family:inherit;font-size:15px;font-weight:bold;padding:10px 20px;border:1px solid var(--line);
    border-bottom:none;background:var(--card);color:var(--sub);cursor:pointer;border-radius:10px 10px 0 0}
  .tabs button[aria-selected="true"]{background:#1d2a55;color:var(--gold);border-color:#3a4a80}
  .frameWrap{padding:0 18px}
  .frame{width:100%;height:calc(100vh - 128px);border:1px solid var(--line);border-top:2px solid #2b4c9b;
    border-radius:0 0 10px 10px;background:#0b1026;display:none}
  .frame.on{display:block}
  .hint{padding:6px 18px 12px;font-size:12px;color:#7f8cc0}
  .hint a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>PROJECT <span class="accent">ROMAN</span></h1>
  <p class="byline">제작자: 용남고 정보쌤(ppo)</p>
  <p class="sub">위치 추적 · L2 도착 대시보드 · 데이터 분석 실습 · 보간 연습 — 탭을 누르면 아래에 관련 페이지가 열립니다.
    모든 페이지는 오프라인에서 동작하며 NASA 궤적 데이터가 각 파일에 내장되어 있습니다.</p>
</header>
<nav class="tabs" role="tablist">
  <button type="button" id="hbTrack" aria-selected="true">위치 추적</button>
  <button type="button" id="hbArrival" aria-selected="false">도착예정</button>
  <button type="button" id="hbData" aria-selected="false">데이터 분석</button>
  <button type="button" id="hbInterp" aria-selected="false">보간연습</button>
</nav>
<div class="frameWrap">
  <iframe class="frame on" id="frTrack" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;로만, 지금 어디? — 낸시 그레이스 로만 우주망원경 위치 추적&lt;/title&gt;
&lt;style&gt;
  :root{
    --bg:#0b1026; --bg2:#101736; --card:#141c3a; --card2:#1a2350;
    --line:#2a3566; --txt:#e8ecf8; --sub:#9aa7cc; --gold:#ffd166;
    --cyan:#6ee7ff; --blue:#5b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #1a2450 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--txt);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    line-height:1.6; font-size:16px;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 40px}
  header{padding:26px 0 8px}
  .kicker{color:var(--cyan);font-size:13px;letter-spacing:2px;font-weight:bold}
  h1{margin:4px 0 6px;font-size:34px;line-height:1.25}
  h1 .accent{color:var(--gold)}
  .lead{color:var(--sub);font-size:15px;margin:0 0 14px}
  .badgeRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .badge{
    display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;
    background:var(--card2);border:1px solid var(--line);color:var(--txt);text-decoration:none;
  }
  .badge.gold{border-color:#8a6a1f;color:var(--gold);font-weight:bold}
  .badge.cy{border-color:#1f5a6a;color:var(--cyan)}
  .badge.warn{border-color:#8a3a3a;color:#ffb0b0;display:none}
  .badge.warn.on{display:inline-block}
  h2{font-size:20px;margin:34px 0 4px}
  .hsub{color:var(--sub);font-size:13px;margin:0 0 12px}
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-top:10px}
  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .card .lab{font-size:12.5px;color:var(--sub);letter-spacing:.5px}
  .card .val{font-size:26px;font-weight:bold;margin-top:4px;font-variant-numeric:tabular-nums;word-break:keep-all}
  .card .val small{font-size:14px;font-weight:normal;color:var(--sub)}
  .card .sub{font-size:12.5px;color:var(--sub);margin-top:4px}
  .card.hero .val{font-size:30px;color:var(--gold)}
  .progWrap{height:12px;background:#0d1330;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
  .progFill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}
  .mapBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:10px}
  .mapBox svg{display:block;width:100%;height:auto}
  .mapTitle{font-size:13px;color:var(--sub);padding:6px 8px 0;font-weight:bold}
  .timeBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
  .tRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tBtn{
    padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;
  }
  .tBtn:hover{background:#233062}
  .tBtn.primary{background:var(--gold);color:#201600;border-color:#8a6a1f}
  input[type=range]{flex:1 1 240px;accent-color:var(--gold);height:26px}
  .tInfo{font-size:14px;font-variant-numeric:tabular-nums}
  .tInfo b{color:var(--gold)}
  .tUTC{font-size:12px;color:var(--sub)}
  .marks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:2px}
  .adoptBox{display:grid;grid-template-columns:360px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
  @media (max-width:760px){.adoptBox{grid-template-columns:1fr}}
  .pixelPanel{display:flex;align-items:center;justify-content:center}
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .steps li:last-child{border-bottom:none}
  .stepNum{
    flex:0 0 30px;height:30px;border-radius:50%;background:var(--gold);color:#201600;
    font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .steps b{color:var(--gold)}
  .note{font-size:13px;color:var(--sub);margin-top:10px}
  .bigLink{
    display:inline-block;margin-top:12px;padding:11px 20px;border-radius:10px;background:var(--gold);
    color:#201600;font-weight:bold;text-decoration:none;font-size:15px;border:1px solid #8a6a1f;
  }
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:10px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .fact h3{margin:0 0 6px;font-size:16px;color:var(--cyan)}
  .fact p{margin:0;font-size:14px;color:var(--txt)}
  footer{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--sub)}
  footer p{margin:4px 0}
  #noData{
    display:none;background:#2a1520;border:1px solid #8a3a3a;color:#ffd9d9;border-radius:14px;
    padding:18px;margin-top:14px;font-size:14px;
  }
  #noData.on{display:block}
  @keyframes pulse{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
  .pulse{animation:pulse 1.6s infinite}
  .pfBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:18px}
  .pfRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pfRow label{font-size:13px;color:var(--sub)}
  .pfRow input{background:#0d1230;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}
  #pixInput{width:160px}
  #pixName{width:110px}
  .pfError{color:#ff9c9c;font-size:13px;min-height:18px;margin-top:6px}
  .pfWrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:4px}
  #pixMosaic{flex:1 1 560px;max-width:760px;width:100%;height:auto;background:#0a0e22;border:1px solid var(--line);border-radius:12px}
  .pfInfo{flex:1 1 220px;min-width:220px;font-size:14px;line-height:1.8;color:var(--txt)}
  .pfInfo b{color:var(--gold)}
  .pfInfo .small{color:var(--sub);font-size:12px}
  .pfSavedHead{margin-top:14px;font-size:12.5px;color:var(--sub)}
  .pfSaved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12.5px;color:var(--sub)}
  .pfChip,.pfDel{cursor:pointer;border-radius:999px;padding:4px 11px;font-size:12.5px;font-family:inherit}
  .pfChip{background:#132046;color:#cfe0ff;border:1px solid #2a3f7a}
  .pfChip:hover{background:#1b2c5e}
  .pfDel{background:#2a1520;color:#ff9c9c;border:1px solid #8a3a3a}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;

&lt;header&gt;
  &lt;div class=&quot;kicker&quot;&gt;NASA · NANCY GRACE ROMAN SPACE TELESCOPE&lt;/div&gt;
  &lt;h1&gt;로만, 지금 어디? &lt;span class=&quot;accent&quot;&gt;/ 150만 km의 여행&lt;/span&gt;&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;
    낸시 그레이스 로만 우주망원경은 2026년 8월 30일에 발사되어 지구에서 약 150만 km 떨어진
    태양-지구 L2점으로 이동하고 있습니다. NASA가 공개하는 궤적 데이터(이 파일에 내장)로 로만의 현재 위치를 확인해 보세요.
  &lt;/p&gt;
  &lt;div class=&quot;badgeRow&quot;&gt;
    &lt;a class=&quot;badge gold&quot; href=&quot;https://science.nasa.gov/mission/roman-space-telescope/adopt-a-pixel/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Adopt a Pixel — 첫 이미지 픽셀 분양 중&lt;/a&gt;
    &lt;span class=&quot;badge cy&quot;&gt;내장 데이터 갱신일: &lt;span id=&quot;srcFetched&quot;&gt;—&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;badge warn&quot; id=&quot;rangeWarn&quot;&gt;표시 시각이 내장 데이터 범위를 벗어났습니다 — 데이터갱신.bat 실행 필요&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;noData&quot;&gt;
    내장 궤적 데이터가 없습니다. 이 폴더의 &lt;b&gt;데이터갱신.bat&lt;/b&gt;을 더블클릭해 실행하면(인터넷 필요)
    NASA 궤적 데이터가 이 파일에 자동으로 저장됩니다. 저장 후 이 페이지를 다시 열어 주세요.
  &lt;/div&gt;
&lt;/header&gt;

&lt;h2&gt;로만의 현재 상태&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;아래 시간 탐색 슬라이더로 발사 직후부터 예측 궤적 끝까지 어느 시점이든 볼 수 있습니다.&lt;/p&gt;
&lt;section class=&quot;dash&quot; id=&quot;dash&quot;&gt;
  &lt;div class=&quot;card hero&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;지구에서 로만까지&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vDist&quot;&gt;—&lt;/span&gt; &lt;small&gt;km&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sDist&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;현재 속도 (지구 기준)&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vSpeed&quot;&gt;—&lt;/span&gt; &lt;small&gt;km/h&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sSpeed&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;발사 후 경과&lt;/div&gt;
    &lt;div class=&quot;val&quot; id=&quot;vElapsed&quot;&gt;—&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sElapsed&quot;&gt;발사: 2026. 8. 30. 20:26 KST&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;L2 여정 진행률&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vProg&quot;&gt;—&lt;/span&gt; &lt;small&gt;%&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;progWrap&quot;&gt;&lt;div class=&quot;progFill&quot; id=&quot;progFill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sProg&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;신호 지연 시간&lt;/div&gt;
    &lt;div class=&quot;val&quot;&gt;&lt;span id=&quot;vLight&quot;&gt;—&lt;/span&gt; &lt;small&gt;초&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sLight&quot;&gt;—&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;h2&gt;지구 근방 확대 지도&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;위쪽 = 태양 반대방향(L2 쪽). 실선은 지나온 길, 점선은 NASA 예측 궤적, 흰 점은 지금 위치입니다.&lt;/p&gt;
&lt;div class=&quot;mapBox&quot;&gt;
  &lt;div class=&quot;mapTitle&quot;&gt;지구를 중심으로 본 로만의 여정 (단위: km, 황도면을 위에서 본 그림)&lt;/div&gt;
  &lt;svg id=&quot;zoomMap&quot; viewBox=&quot;0 0 900 740&quot; role=&quot;img&quot; aria-label=&quot;지구 중심 로만 궤적 지도&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;div class=&quot;mapBox&quot;&gt;
  &lt;div class=&quot;mapTitle&quot;&gt;태양계 전경 — 로만은 지구와 함께 태양을 공전합니다&lt;/div&gt;
  &lt;svg id=&quot;solarMap&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;태양과 지구 궤도 전경 지도&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;

&lt;h2&gt;시간 탐색&lt;/h2&gt;
&lt;div class=&quot;timeBox&quot;&gt;
  &lt;div class=&quot;tRow&quot;&gt;
    &lt;button class=&quot;tBtn primary&quot; id=&quot;btnPlay&quot; type=&quot;button&quot;&gt;여정 재생&lt;/button&gt;
    &lt;button class=&quot;tBtn&quot; id=&quot;btnStop&quot; type=&quot;button&quot;&gt;정지&lt;/button&gt;
    &lt;button class=&quot;tBtn&quot; id=&quot;btnNow&quot; type=&quot;button&quot;&gt;지금 보기&lt;/button&gt;
    &lt;input type=&quot;range&quot; id=&quot;timeSlider&quot; min=&quot;0&quot; max=&quot;1000&quot; value=&quot;1000&quot; step=&quot;1&quot; aria-label=&quot;시간 탐색 슬라이더&quot;&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tInfo&quot;&gt;표시 시각: &lt;b id=&quot;tLabel&quot;&gt;—&lt;/b&gt; &lt;span class=&quot;tUTC&quot; id=&quot;tLabelUTC&quot;&gt;&lt;/span&gt; &lt;span id=&quot;tMode&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;marks&quot;&gt;
    &lt;span&gt;발사 직후&lt;/span&gt;
    &lt;span id=&quot;markNow&quot;&gt;지금&lt;/span&gt;
    &lt;span&gt;예측 궤적 끝&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;Adopt a Pixel — 첫 이미지의 픽셀을 분양받아요&lt;/h2&gt;
&lt;p class=&quot;hsub&quot;&gt;로만이 우주를 처음 촬영하면, 그 이미지의 픽셀 하나하나가 신청자에게 배정됩니다.&lt;/p&gt;
&lt;section class=&quot;adoptBox&quot;&gt;
  &lt;div class=&quot;pixelPanel&quot;&gt;
    &lt;svg id=&quot;pixelSvg&quot; viewBox=&quot;0 0 344 260&quot; role=&quot;img&quot; aria-label=&quot;픽셀 격자 그림&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;ol class=&quot;steps&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;1&lt;/span&gt;&lt;span&gt;&lt;b&gt;이메일로 신청&lt;/b&gt; — NASA Adopt a Pixel 페이지에서 이메일 주소 하나당 픽셀 하나를 분양받습니다. (가족이 이메일을 함께 쓴다면 그 픽셀을 함께 공유해요)&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;2&lt;/span&gt;&lt;span&gt;&lt;b&gt;첫 촬영을 기다림&lt;/b&gt; — 로만이 L2점에 도달해 시운전을 마친 뒤, 우주를 향해 첫 관측을 시작합니다.&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;stepNum&quot;&gt;3&lt;/span&gt;&lt;span&gt;&lt;b&gt;픽셀 수령&lt;/b&gt; — 첫 이미지가 공개되면 내 픽셀 번호와 인증서를 이메일로 받습니다. 인쇄해서 친구들에게 자랑할 수 있어요!&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;note&quot;&gt;
      왼쪽 격자는 첫 이미지의 모습을 본떠 그린 그림입니다. 반짝이는 칸 하나가 내 픽셀 —
      역사적인 첫 이미지의 한 조각이 되는 것입니다.
    &lt;/div&gt;
    &lt;a class=&quot;bigLink&quot; href=&quot;https://science.nasa.gov/mission/roman-space-telescope/adopt-a-pixel/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NASA Adopt a Pixel 페이지 열기&lt;/a&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;h2&gt;내 픽셀 찾기&lt;/h2&gt;
&lt;section class=&quot;pfBox&quot;&gt;
  &lt;div class=&quot;pfRow&quot;&gt;
    &lt;label for=&quot;pixInput&quot;&gt;픽셀 번호&lt;/label&gt;

&lt;h2&gt;로만 이야기&lt;/h2&gt;
&lt;section class=&quot;facts&quot;&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;발사&lt;/h3&gt;
    &lt;p&gt;2026년 8월 30일 20:26(KST), 플로리다 케네디 우주센터에서 스페이스X 팰컨 헤비 로켓으로 발사되었습니다.
       20:57경 로켓 2단에서 분리되어 홀로 우주를 날기 시작했고, 태양광 차폐막 6판이 펼쳐졌습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;왜 L2점인가?&lt;/h3&gt;
    &lt;p&gt;태양-지구 L2점(지구에서 약 150만 km)은 태양·지구·달이 항상 망원경 뒤편에 있는 특별한 자리입니다.
       이들의 빛이 관측을 방해하지 않아 하늘 전체를 자유롭게 볼 수 있고 온도도 안정적입니다.
       웹b 우주망원경도 이곳에서 관측 중입니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;로만의 능력&lt;/h3&gt;
    &lt;p&gt;주경 지름 2.4m, 광시야 카메라(WFI) 약 3억 화소. 같은 선명도에서 허블 적외선 관측보다
       100배 넓은 하늘을 한 번에 담습니다. 하루 약 11테라비트의 관측 데이터를 지구로 보냅니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;이름의 유래&lt;/h3&gt;
    &lt;p&gt;낸시 그레이스 로만 박사 — NASA 최초의 여성 고위 임원이자 허블 우주망원경 실현의 주역으로,
       허블의 어머니라 불립니다. 우주망원경의 시대를 연 사람의 이름이 이 망원경에 담겼습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;사명&lt;/h3&gt;
    &lt;p&gt;암흑에너지의 정체 밝히기, 중력 미세렌즈로 보이지 않는 외계행성 찾기, 적외선로 은하와 별의
       탄생 지도 그리기. 임무 기간은 최소 5년이며, 우주에서 로봇으로 재급유받을 수 있게 설계되었습니다.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fact&quot;&gt;
    &lt;h3&gt;관측 시작은 언제?&lt;/h3&gt;
    &lt;p&gt;L2 도달과 시운전이 끝나면 본격 관측이 시작되고 첫 이미지가 공개됩니다.
       그때 Adopt a Pixel 신청자에게 픽셀 번호가 배정됩니다. 그날까지 이 지도에서 로만의 여정을 지켜볼 수 있습니다.&lt;/p&gt;
  &lt;/div&gt;
&lt;footer&gt;
  &lt;p&gt;위치 데이터: NASA/JPL Horizons 시스템(천체 번호 -211, 낸시 그레이스 로만 우주망원경), 궤적 출처는 NASA 고다드우주비행센터(GSFC) 비행동역학팀 예측궤적입니다. 교육용 시각화이며 NASA 공식 제품이 아닙니다.&lt;/p&gt;
  &lt;p&gt;시각 표기: 궤적 데이터의 시각(TDB)을 UTC로 근사 환산(오차 약 1분 이내)하여 한국시간(KST)으로 보여줍니다.&lt;/p&gt;
  &lt;p&gt;갱신 방법: 인터넷에 연결된 상태에서 &lt;b&gt;데이터갱신.bat&lt;/b&gt;을 더블클릭하면 NASA의 최신 예측 궤적으로 이 파일의 데이터가 교체됩니다. 갱신 전이라도 내장 데이터 범위(현재: &lt;span id=&quot;srcRange&quot;&gt;—&lt;/span&gt;) 안에서는 정확하게 동작합니다.&lt;/p&gt;
&lt;/footer&gt;

  function tableAt(T, jd){
    var f = (jd - T.t0) / T.dt;
    var fc = clamp(f, 0, T.n - 1);
    var i = Math.min(Math.floor(fc), T.n - 2);

      el(zPredBadge, &quot;text&quot;, { x: 66, y: 58, fill: &quot;#ff9ec1&quot;, &quot;font-size&quot;: 12.5, &quot;text-anchor&quot;: &quot;middle&quot;, &quot;font-weight&quot;: &quot;bold&quot; }, &quot;예측 위치&quot;);

      el(zSvg, &quot;line&quot;, { x1: 24, y1: barY, x2: 24 + barLen, y2: barY, stroke: &quot;#e8ecf8&quot;, &quot;stroke-width&quot;: 2 });

      el(zSvg, &quot;line&quot;, { x1: 24 + barLen, y1: barY - 5, x2: 24 + barLen, y2: barY + 5, stroke: &quot;#e8ecf8&quot;, &quot;stroke-width&quot;: 2 });
      el(zSvg, &quot;text&quot;, { x: 24, y: barY - 10, fill: &quot;#9aa7cc&quot;, &quot;font-size&quot;: 12 }, &quot;50만 km&quot;);

    function zoomRender(jd){
      var nowJ = RT.nowJD();
      var end = RT.range().end;
      var t0 = RT_DATA.R.t0;
      function pts(fromJd, toJd, step){
        var out = [];
        for (var j = fromJd; j &lt;= toJd; j += step){
          var p = RT.projRel(Math.min(j, end));
          out.push((ZCX + p.side*ZSCALE).toFixed(1) + &quot;,&quot; + (ZCY - p.out*ZSCALE).toFixed(1));
        }
        var pe = RT.projRel(Math.min(toJd, end));
        out.push((ZCX + pe.side*ZSCALE).toFixed(1) + &quot;,&quot; + (ZCY - pe.out*ZSCALE).toFixed(1));
        return out.join(&quot; &quot;);
      }
      zTrailPast.setAttribute(&quot;points&quot;, pts(t0, Math.min(jd, end), 1/12));
      zTrailFuture.setAttribute(&quot;points&quot;, jd &lt; end ? pts(Math.min(jd, end), end, 1/6) : &quot;&quot;);
      var pr = RT.projRel(Math.min(jd, end));
      var sx = RT.clamp(ZCX + pr.side*ZSCALE, 8, ZW-8);
      var sy = RT.clamp(ZCY - pr.out*ZSCALE, 8, ZH-8);
      zShip.setAttribute(&quot;cx&quot;, sx.toFixed(1)); zShip.setAttribute(&quot;cy&quot;, sy.toFixed(1));
      zShipLbl.setAttribute(&quot;x&quot;, Math.min(sx + 11, ZW - 40).toFixed(1)); zShipLbl.setAttribute(&quot;y&quot;, Math.max(sy - 9, 16).toFixed(1));
      var pn = RT.projRel(Math.min(nowJ, end));
      zNowDot.setAttribute(&quot;cx&quot;, RT.clamp(ZCX + pn.side*ZSCALE, 8, ZW-8).toFixed(1));
      zNowDot.setAttribute(&quot;cy&quot;, RT.clamp(ZCY - pn.out*ZSCALE, 8, ZH-8).toFixed(1));
      var pred = jd &gt; nowJ + 1/24;
      zPredBadge.setAttribute(&quot;opacity&quot;, pred ? &quot;1&quot; : &quot;0&quot;);
      zTimeTxt.textContent = &quot;표시 시각: &quot; + RT.fmtKST(jd) + (pred ? &quot; (예측)&quot; : &quot;&quot;);
    }

    /* ---------- 태양계 전경 지도 ---------- */

    function solarInit(){
      stars(sSvg, 70, SW, SH, 777);
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: SORBIT, fill: &quot;none&quot;, stroke: &quot;#3a4a86&quot;, &quot;stroke-width&quot;: 1.2, &quot;stroke-dasharray&quot;: &quot;4 6&quot; });
      el(sSvg, &quot;text&quot;, { x: 20, y: SH - 8, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 12 }, &quot;지구 궤도 (1 AU = 약 1억 4,960만 km)&quot;);
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: 18, fill: &quot;#ffd166&quot;, opacity: 0.25 });
      el(sSvg, &quot;circle&quot;, { cx: SCX, cy: SCY, r: 11, fill: &quot;#ffcf5c&quot; });
      el(sSvg, &quot;text&quot;, { x: SCX, y: SCY - 28, fill: &quot;#ffcf5c&quot;, &quot;font-size&quot;: 13, &quot;font-weight&quot;: &quot;bold&quot;, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;태양&quot;);
      sRing = el(sSvg, &quot;circle&quot;, { r: 34, fill: &quot;#0b1026&quot;, stroke: &quot;#5a6aa8&quot;, &quot;stroke-width&quot;: 1.2, &quot;stroke-dasharray&quot;: &quot;3 4&quot; });

    function solarRender(jd){
      var e = RT.earthPos(jd);
      var m = Math.sqrt(e[0]*e[0] + e[1]*e[1]);
      var ux = e[0]/m, uy = e[1]/m;
      var ex = SCX + SORBIT*ux, ey = SCY - SORBIT*uy;
      var cx = ex - 46, cy = ey - 40;
      if (cx &lt; 62) { cx = ex + 46; }
      if (cy &lt; 44) { cy = ey + 42; }
      if (cy &gt; SH - 58) { cy = SH - 58; }
      sEarth.setAttribute(&quot;cx&quot;, ex.toFixed(1)); sEarth.setAttribute(&quot;cy&quot;, ey.toFixed(1));
      sEarthLbl.setAttribute(&quot;x&quot;, (ex + 12).toFixed(1)); sEarthLbl.setAttribute(&quot;y&quot;, (ey + 4).toFixed(1));
      sRing.setAttribute(&quot;cx&quot;, cx.toFixed(1)); sRing.setAttribute(&quot;cy&quot;, cy.toFixed(1));
      sCalloutEarth.setAttribute(&quot;cx&quot;, cx.toFixed(1)); sCalloutEarth.setAttribute(&quot;cy&quot;, cy.toFixed(1));
      var pr = RT.projRel(jd);
      var ang = Math.atan2(pr.out, pr.side);
      var shipX = cx - 17*Math.cos(ang), shipY = cy - 17*Math.sin(ang);
      var l2x = cx, l2y = cy - 26;
      sCalloutL2.setAttribute(&quot;cx&quot;, l2x.toFixed(1)); sCalloutL2.setAttribute(&quot;cy&quot;, l2y.toFixed(1));
      sCalloutShip.setAttribute(&quot;cx&quot;, shipX.toFixed(1)); sCalloutShip.setAttribute(&quot;cy&quot;, shipY.toFixed(1));
      sLblL2.setAttribute(&quot;x&quot;, (l2x + 5).toFixed(1)); sLblL2.setAttribute(&quot;y&quot;, (l2y + 3).toFixed(1));
      sLblShip.setAttribute(&quot;x&quot;, (shipX + 5).toFixed(1)); sLblShip.setAttribute(&quot;y&quot;, (shipY + 3).toFixed(1));
      var dx = cx - ex, dy = cy - ey, dl = Math.sqrt(dx*dx + dy*dy) || 1;
      sLink.setAttribute(&quot;x1&quot;, (ex + dx/dl*9).toFixed(1)); sLink.setAttribute(&quot;y1&quot;, (ey + dy/dl*9).toFixed(1));
      sLink.setAttribute(&quot;x2&quot;, (cx - dx/dl*34).toFixed(1)); sLink.setAttribute(&quot;y2&quot;, (cy - dy/dl*34).toFixed(1));
      sZoomRingLbl.setAttribute(&quot;x&quot;, cx.toFixed(1));
      sZoomRingLbl.setAttribute(&quot;y&quot;, (cy + 47).toFixed(1));
    }

    /* ---------- Adopt a Pixel 격자 그림 ---------- */
    function pixelInit(){
      var svg = $(&quot;pixelSvg&quot;);
      var cols = 12, rows = 8, cell = 24, gap = 3, ox = 14, oy = 12;
      var rnd = mulberry32(1024);
      var palette = [&quot;#16204a&quot;, &quot;#1a2a5e&quot;, &quot;#223a7a&quot;, &quot;#2a4a92&quot;, &quot;#1f2f6e&quot;, &quot;#182452&quot;];
      el(svg, &quot;rect&quot;, { x: ox - 6, y: oy - 6, width: cols*(cell+gap) + 8, height: rows*(cell+gap) + 8, rx: 10, fill: &quot;#0d1330&quot;, stroke: &quot;#2a3566&quot; });
      var px = 3, py = 5;
      for (var r = 0; r &lt; rows; r++){
        for (var c = 0; c &lt; cols; c++){
          var x = ox + c*(cell+gap), y = oy + r*(cell+gap);
          var isStar = rnd() &lt; 0.10;
          var fill = isStar ? (rnd() &lt; 0.5 ? &quot;#cfe6ff&quot; : &quot;#ffe9b8&quot;) : palette[Math.floor(rnd()*palette.length)];
          if (r === py &amp;&amp; c === px) fill = &quot;#ffd166&quot;;
          var rect = el(svg, &quot;rect&quot;, { x: x, y: y, width: cell, height: cell, rx: 3, fill: fill, opacity: isStar ? 0.95 : 0.9 });
          if (r === py &amp;&amp; c === px){
            rect.setAttribute(&quot;stroke&quot;, &quot;#ffffff&quot;); rect.setAttribute(&quot;stroke-width&quot;, &quot;2.5&quot;);
            rect.setAttribute(&quot;class&quot;, &quot;pulse&quot;);
            el(svg, &quot;text&quot;, { x: x + cell/2, y: y - 7, fill: &quot;#ffd166&quot;, &quot;font-size&quot;: 12.5, &quot;font-weight&quot;: &quot;bold&quot;, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;내 픽셀&quot;);
          }
        }
      }
      el(svg, &quot;text&quot;, { x: ox - 6 + cols*(cell+gap)/2 + 1, y: oy + rows*(cell+gap) + 24, fill: &quot;#9aa7cc&quot;, &quot;font-size&quot;: 12.5, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;로만의 첫 이미지 (상상 그림) — 각 칸이 픽셀 하나&quot;);
    }

    /* ---------- 전체 렌더 / 시간 모드 ---------- */
    var slider = $(&quot;timeSlider&quot;);
    var mode = &quot;live&quot;;                 // live | scrub | play
    var playTimer = null, liveTimer = null;
    var t0 = RT_DATA.R.t0, tEnd = RT.range().end;
    var curJd = RT.clamp(RT.nowJD(), t0, tEnd);

    function render(jd){
      var m = RT.metrics(jd);
      $(&quot;vDist&quot;).textContent = RT.fmtInt(m.rg);
      $(&quot;sDist&quot;).textContent = &quot;달까지 거리의 약 &quot; + (m.rg/RT.MOON_D).toFixed(1) + &quot;배&quot;;
      $(&quot;vSpeed&quot;).textContent = RT.fmtInt(m.speedKmh);
      $(&quot;sSpeed&quot;).textContent = &quot;(초속 &quot; + m.speedKms.toFixed(2) + &quot; km)&quot;;
      $(&quot;vElapsed&quot;).textContent = RT.fmtElapsed(m.elapsedDays);
      $(&quot;vProg&quot;).textContent = (m.prog*100).toFixed(1);
      $(&quot;progFill&quot;).style.width = (m.prog*100).toFixed(1) + &quot;%&quot;;
      $(&quot;sProg&quot;).textContent = &quot;L2까지 약 &quot; + RT.fmtInt(m.remain) + &quot; km 남음&quot;;
      $(&quot;vLight&quot;).textContent = m.lightSec.toFixed(2);
      $(&quot;sLight&quot;).textContent = &quot;지구-로만 신호 왕복 약 &quot; + (m.lightSec*2).toFixed(1) + &quot;초&quot;;
      zoomRender(jd);
      solarRender(jd);
      $(&quot;tLabel&quot;).textContent = RT.fmtKST(jd);

      $(&quot;tMode&quot;).textContent = mode === &quot;live&quot; ? &quot; · 실시간&quot; : (mode === &quot;play&quot; ? &quot; · 여정 재생&quot; : &quot;&quot;);
      if (mode !== &quot;scrub&quot;){
        slider.value = String(Math.round((jd - t0) / (tEnd - t0) * 1000));
      }
      $(&quot;rangeWarn&quot;).className = &quot;badge warn&quot; + (RT.nowJD() &gt; tEnd ? &quot; on&quot; : &quot;&quot;);
      curJd = jd;
    }

    function stopPlay(){
      if (playTimer){ clearInterval(playTimer); playTimer = null; }
    }
    function setMode(md){
      mode = md;
      if (md !== &quot;play&quot;) stopPlay();
    }

    slider.addEventListener(&quot;input&quot;, function(){
      setMode(&quot;scrub&quot;);
      var v = RT.clamp(parseFloat(slider.value) || 0, 0, 1000);
      render(t0 + (tEnd - t0) * v / 1000);
    });
    $(&quot;btnNow&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;live&quot;);
      render(RT.clamp(RT.nowJD(), t0, tEnd));
    });
    $(&quot;btnStop&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;scrub&quot;);
      render(curJd);
    });
    $(&quot;btnPlay&quot;).addEventListener(&quot;click&quot;, function(){
      setMode(&quot;play&quot;);
      var from = t0, to = Math.min(RT.nowJD(), tEnd);
      var startedAt = Date.now(), dur = 24000;
      stopPlay();
      playTimer = setInterval(function(){
        var k = (Date.now() - startedAt) / dur;
        if (k &gt;= 1){
          stopPlay();
          var n = RT.nowJD();
          if (n &lt;= tEnd){ setMode(&quot;live&quot;); render(n); }
          else { setMode(&quot;scrub&quot;); render(to); }
          return;
        }
        render(from + (to - from) * k);
      }, 40);
    });

    liveTimer = setInterval(function(){
      if (mode !== &quot;live&quot;) return;
      render(RT.clamp(RT.nowJD(), t0, tEnd));
    }, 500);

    /* ---------- 픽셀 찾기 (시연용) ---------- */
    var PF_SX = 30, PF_SY = 76, PF_STEP = 54, PF_CELL = 46;   /* 센서 지도 6열 x 3행 */
    var PF_ZX = 420, PF_ZY = 60, PF_ZW = 288;                  /* 검출기 확대 32x32 블록 x 9px */
    var PF_COLS = 6, PF_ROWS = 3, PF_DET = 16777216;

    var pfSenHi, pfBlkHi, pfDot;
    var pfList = [];
    try { pfList = JSON.parse(window.localStorage.getItem(&quot;romanPix_v1&quot;) || &quot;[]&quot;) || []; } catch(e){ pfList = []; }

    function pfInit(){
      var svg = $(&quot;pixMosaic&quot;);
      el(svg, &quot;text&quot;, { x: PF_SX, y: 58, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 13 }, &quot;WFI 검출기 18개 (도식)&quot;);
      el(svg, &quot;text&quot;, { x: PF_ZX, y: 44, fill: &quot;#7f8cc0&quot;, &quot;font-size&quot;: 13 }, &quot;선택한 검출기 확대 (4,096 x 4,096 픽셀)&quot;);
      for (var r = 0; r &lt; PF_ROWS; r++){
        for (var c = 0; c &lt; PF_COLS; c++){
          el(svg, &quot;rect&quot;, { x: PF_SX + c*PF_STEP, y: PF_SY + r*PF_STEP, width: PF_CELL, height: PF_CELL,
            fill: &quot;#111a3f&quot;, stroke: &quot;#2a355f&quot;, rx: 4 });
          el(svg, &quot;text&quot;, { x: PF_SX + c*PF_STEP + PF_CELL/2, y: PF_SY + r*PF_STEP + PF_CELL/2 + 4,
            fill: &quot;#9fb3ff&quot;, &quot;font-size&quot;: 11, &quot;text-anchor&quot;: &quot;middle&quot; }, String(r*PF_COLS + c + 1));
        }
      }
      el(svg, &quot;rect&quot;, { x: PF_ZX, y: PF_ZY, width: PF_ZW, height: PF_ZW, fill: &quot;#0c1128&quot;, stroke: &quot;#2a355f&quot; });
      var zg = el(svg, &quot;g&quot;, { transform: &quot;translate(&quot; + PF_ZX + &quot; &quot; + PF_ZY + &quot;)&quot; });
      for (var k = 1; k &lt; 16; k++){
        el(zg, &quot;line&quot;, { x1: k*18, y1: 0, x2: k*18, y2: PF_ZW, stroke: &quot;#1b2750&quot;, &quot;stroke-width&quot;: 1 });
        el(zg, &quot;line&quot;, { x1: 0, y1: k*18, x2: PF_ZW, y2: k*18, stroke: &quot;#1b2750&quot;, &quot;stroke-width&quot;: 1 });
      }
      stars(zg, 170, PF_ZW, PF_ZW, 4242);
      pfSenHi = el(svg, &quot;rect&quot;, { x: 0, y: 0, width: PF_CELL, height: PF_CELL, fill: &quot;rgba(255,209,102,0.22)&quot;,
        stroke: &quot;#ffd166&quot;, &quot;stroke-width&quot;: 2, rx: 4, opacity: 0 });
      pfBlkHi = el(svg, &quot;rect&quot;, { x: 0, y: 0, width: 9, height: 9, fill: &quot;rgba(255,209,102,0.30)&quot;,
        stroke: &quot;#ffd166&quot;, &quot;stroke-width&quot;: 1.5, opacity: 0 });
      pfDot = el(svg, &quot;circle&quot;, { cx: 0, cy: 0, r: 3, fill: &quot;#ffd166&quot;, stroke: &quot;#ffffff&quot;, &quot;stroke-width&quot;: 1, opacity: 0 });
      el(svg, &quot;text&quot;, { x: PF_SX, y: 392, fill: &quot;#5b6a99&quot;, &quot;font-size&quot;: 11 },
        &quot;왼쪽: 검출기 배치(도식) / 오른쪽: 번호가 가리키는 블록(128 x 128 픽셀)과 픽셀 위치&quot;);

      $(&quot;pixSearch&quot;).addEventListener(&quot;click&quot;, function(){ pfShow(parseInt($(&quot;pixInput&quot;).value, 10)); });
      $(&quot;pixInput&quot;).addEventListener(&quot;keydown&quot;, function(ev){
        if (ev.key === &quot;Enter&quot;) pfShow(parseInt($(&quot;pixInput&quot;).value, 10));
      });
      $(&quot;pixSave&quot;).addEventListener(&quot;click&quot;, function(){
        var n = parseInt($(&quot;pixInput&quot;).value, 10);
        if (!pfShow(n)) return;
        var name = ($(&quot;pixName&quot;).value || &quot;&quot;).trim() || (&quot;픽셀 &quot; + RT.fmtInt(n));
        var found = null;
        for (var i = 0; i &lt; pfList.length; i++){ if (pfList[i].num === n) found = pfList[i]; }
        if (found) found.name = name;
        else pfList.unshift({ name: name, num: n });
        if (pfList.length &gt; 40) pfList.pop();
        pfSaveList();
      });
      pfRenderList();
      if (pfList.length){ $(&quot;pixInput&quot;).value = pfList[0].num; pfShow(pfList[0].num); }
    }

    function pfShow(n){
      var err = &quot;&quot;;
      if (!n || !isFinite(n)) err = &quot;픽셀 번호를 입력하세요. (예: 1297)&quot;;
      else if (n &lt; 1 || n &gt; PF_TOTAL) err = &quot;1 이상 &quot; + RT.fmtInt(PF_TOTAL) + &quot; 이하의 번호를 입력하세요. (WFI 약 3억 픽셀)&quot;;
      if (err){ $(&quot;pixError&quot;).textContent = err; return false; }
      $(&quot;pixError&quot;).textContent = &quot;&quot;;
      var sensor = Math.ceil(n / PF_DET);
      var within = n - (sensor - 1) * PF_DET;
      var row = Math.ceil(within / 4096), col = within - (row - 1) * 4096;
      var sr = Math.floor((sensor - 1) / PF_COLS), sc = (sensor - 1) % PF_COLS;
      pfSenHi.setAttribute(&quot;x&quot;, (PF_SX + sc * PF_STEP).toFixed(1));
      pfSenHi.setAttribute(&quot;y&quot;, (PF_SY + sr * PF_STEP).toFixed(1));

(function(){
  var D = window.ROMAN_DATA, R = D &amp;&amp; D.R ? D.R : null;

  if (!R || !R.X || !R.X.length){ $(&quot;noData&quot;).style.display = &quot;block&quot;; return; }
  var n = R.n, t0 = R.t0, dt = R.dt, tEnd = t0 + (n - 1) * dt;

  function fmtInt(v){ return Math.round(v).toLocaleString(&quot;ko-KR&quot;); }
  function posAt(jd){
    var f = (jd - t0) / dt;
    f = Math.min(Math.max(f, 0), n - 1);
    var i = Math.min(Math.floor(f), n - 2), r = f - i, j = Math.min(i + 1, n - 1);
    function L(a){ return a[i] + (a[j] - a[i]) * r; }
    return [L(R.X) * 1000, L(R.Y) * 1000, L(R.Z) * 1000];
  }
  function rgAt(jd){ var p = posAt(jd); return Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2]); }

      {timeZone:&quot;Asia/Seoul&quot;, year:&quot;numeric&quot;, month:&quot;long&quot;, day:&quot;numeric&quot;, weekday:&quot;short&quot;,

&lt;body&gt;

&lt;h1&gt;실습지 v2 · NASA 데이터를 내 손으로&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;로만(낸시 그레이스 로만 우주망원경) 위치 데이터 — 수집 → 정리 → 시각화 → 해석&lt;/p&gt;

&lt;nav class=&quot;tabs noprint&quot; role=&quot;tablist&quot;&gt;
  &lt;button type=&quot;button&quot; id=&quot;tbtnData&quot; aria-selected=&quot;true&quot;&gt;① 데이터 받기&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;tbtnArrival&quot; aria-selected=&quot;false&quot;&gt;② 도착예정&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;tbtnView&quot; aria-selected=&quot;false&quot;&gt;③ 로만데이터&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;tbtnViz&quot; aria-selected=&quot;false&quot;&gt;④ 데이터 시각화&lt;/button&gt;
&lt;/nav&gt;

&lt;section class=&quot;tabSec on&quot; id=&quot;tabData&quot;&gt;
&lt;div class=&quot;box thin&quot;&gt;실습 날짜: &lt;span style=&quot;display:inline-block;width:110px&quot;&gt;&lt;/span&gt;
반 · 이름: &lt;span style=&quot;display:inline-block;width:150px&quot;&gt;&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;flow&quot;&gt;&lt;span&gt;1 데이터 수집&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;2 데이터 정리&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;
&lt;span&gt;3 시각화&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;4 해석&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;학습 목표&lt;/h3&gt;
&lt;ul&gt;
  &lt;li&gt;1차 데이터 출처에서 필요한 데이터를 조건(기간·간격·항목)을 정해 수집할 수 있다.&lt;/li&gt;
  &lt;li&gt;데이터의 단위를 확인하고, 단위를 환산해 정리할 수 있다.&lt;/li&gt;
  &lt;li&gt;시계열 데이터를 그래프로 나타내고 변화 경향을 해석할 수 있다.&lt;/li&gt;
  &lt;li&gt;데이터의 출처와 만들어진 과정(예측 궤적)을 설명할 수 있다.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;b&gt;준비물&lt;/b&gt; — 인터넷 연결 컴퓨터, 웹 브라우저, 스프레드시트(엑셀·구글시트·리브레오피스), 이 실습지&lt;/p&gt;

&lt;h2&gt;STEP 1 · 데이터 요청 — NASA JPL Horizons&lt;/h2&gt;
&lt;p&gt;로만의 위치 데이터는 NASA 제트추진연구소(JPL)의 &lt;b&gt;Horizons&lt;/b&gt; 시스템에서 공개합니다.
   발사된 NASA 임무의 궤적은 전 세계 누구나 같은 방식으로 요청해 받을 수 있습니다.&lt;/p&gt;
&lt;ol&gt;
  &lt;li&gt;브라우저에서 &lt;code&gt;https://ssd.jpl.nasa.gov/horizons/&lt;/code&gt; 접속 → 상단 &lt;b&gt;App&lt;/b&gt; 탭 클릭&lt;/li&gt;
  &lt;li&gt;아래 표의 순서대로 설정한 뒤 &lt;b&gt;Generate Ephemeris&lt;/b&gt; 버튼 클릭&lt;/li&gt;
&lt;/ol&gt;
&lt;table&gt;
  &lt;tr&gt;&lt;th style=&quot;width:170px&quot;&gt;설정 항목&lt;/th&gt;&lt;th&gt;입력할 값&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Target Body&lt;/td&gt;&lt;td&gt;검색창에 &lt;code&gt;Roman&lt;/code&gt; 입력 → &lt;b&gt;Nancy Grace Roman Space Telescope (-211)&lt;/b&gt; 선택&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Observer Location&lt;/td&gt;&lt;td&gt;&lt;b&gt;Geocentric [Earth center]&lt;/b&gt; (지구 중심, 코드 500)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Time Span&lt;/td&gt;&lt;td&gt;Start: &lt;code&gt;2026-08-30 12:00&lt;/code&gt; / Stop: 실습일 날짜 / Step size: &lt;b&gt;1 day&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Table Settings&lt;/td&gt;&lt;td&gt;Quantity: &lt;b&gt;20. Range &amp;amp; Range-rate&lt;/b&gt; 선택 (거리와 거리 변화율)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Display/Output&lt;/td&gt;&lt;td&gt;&lt;b&gt;CSV&lt;/b&gt; (스프레드시트용)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;오류가 나면&lt;/b&gt;: 화면에 &lt;code&gt;No ephemeris for target ... prior to A.D. 2026-AUG-30 11:58&lt;/code&gt; 메시지가 뜨면 시작 시각이 데이터의 첫 시점보다 앞선 것입니다. 로만의 궤적 데이터는 발사(11:26 UT) 약 32분 뒤인 분리 순간(11:58 UT)부터 존재하므로, Start를 &lt;code&gt;2026-08-30 12:00&lt;/code&gt;으로 입력했는지 확인하세요. Stop이 궤적 공개 범위를 벗어나도 비슷한 오류가 납니다 — 이때도 오류 메시지가 알려주는 범위 안으로 날짜를 조정합니다. 오류 메시지를 읽고 원인을 추론하는 것도 데이터 작업의 중요한 습관입니다.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;기록 1 — 내가 받은 데이터: 시작 날짜 &lt;span style=&quot;display:inline-block;width:110px&quot;&gt;&lt;/span&gt;
끝 날짜 &lt;span style=&quot;display:inline-block;width:110px&quot;&gt;&lt;/span&gt; 행 개수 &lt;span style=&quot;display:inline-block;width:70px&quot;&gt;&lt;/span&gt;
delta의 단위는 &lt;span style=&quot;display:inline-block;width:80px&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;인터넷을 쓸 수 없는 환경이라면 &lt;b&gt;③ 로만데이터 탭&lt;/b&gt;에서 같은 궤적 데이터를 화면으로 볼 수 있고
  CSV 파일로 내려받아 STEP 2부터 진행할 수 있습니다(파일 안에 NASA 궤적이 내장되어 있습니다).&lt;/div&gt;

&lt;h2&gt;STEP 2 · 데이터 정리 — 단위 환산이 있는 데이터 클리닝&lt;/h2&gt;
&lt;p&gt;출력 결과에서 &lt;code&gt;$$SOE&lt;/code&gt;와 &lt;code&gt;$$EOE&lt;/code&gt; &lt;b&gt;사이의 데이터 행만&lt;/b&gt; 복사해 시트에 붙여넣습니다.&lt;/p&gt;
&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;열&lt;/th&gt;&lt;th&gt;내용&lt;/th&gt;&lt;th&gt;시트 수식 예시&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;날짜&lt;/td&gt;&lt;td&gt;붙여넣기&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;B&lt;/td&gt;&lt;td&gt;delta (거리, AU 단위)&lt;/td&gt;&lt;td&gt;붙여넣기&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;C&lt;/td&gt;&lt;td&gt;deldot (거리 변화율, km/s)&lt;/td&gt;&lt;td&gt;붙여넣기&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;D&lt;/td&gt;&lt;td&gt;&lt;b&gt;거리(km)&lt;/b&gt; — 단위 환산&lt;/td&gt;&lt;td&gt;&lt;code&gt;=B2*149597870.7&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;E&lt;/td&gt;&lt;td&gt;&lt;b&gt;하루 증가량(km)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;=D3-D2&lt;/code&gt; (3행부터)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;div class=&quot;calc&quot;&gt;&lt;b&gt;AU(천문단위)란?&lt;/b&gt; 태양~지구의 평균 거리 = &lt;b&gt;149,597,870.7 km&lt;/b&gt;.
  로만은 현재 지구에서 1AU의 약 0.6~1.0% 거리에 있습니다.
  계산 예시 — 2026-09-11 데이터 &lt;code&gt;0.00630327701181 AU&lt;/code&gt; × 149,597,870.7 ≈ &lt;b&gt;942,864 km&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;기록 2 — 발사 다음 날(8/31) 거리: &lt;span style=&quot;display:inline-block;width:120px&quot;&gt;&lt;/span&gt; km,
  실습일 거리: &lt;span style=&quot;display:inline-block;width:120px&quot;&gt;&lt;/span&gt; km, 그동안 이동: &lt;span style=&quot;display:inline-block;width:120px&quot;&gt;&lt;/span&gt; km&lt;/p&gt;&lt;/div&gt;

&lt;h2 class=&quot;pagebreak&quot;&gt;STEP 3 · 시각화 — 그래프로 보기&lt;/h2&gt;
&lt;ol&gt;
  &lt;li&gt;D열(거리 km)을 &lt;b&gt;꺾은선 그래프&lt;/b&gt;로 그린다. 가로축 = 날짜, 세로축 = 거리(km)&lt;/li&gt;
  &lt;li&gt;(선택) E열(하루 증가량)도 그래프로 그려 비교한다&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;b&gt;시각화 점검표&lt;/b&gt; — 그래프에 반드시 확인: □ 축 이름과 단위 □ 그래프 제목 □ 데이터 출처 표기&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;그래프를 시트에서 완성했다면, 같은 폴더의 &lt;b&gt;로만위치추적.html&lt;/b&gt;을 열어
  슬라이더를 같은 날짜로 옮겨 보세요. 내가 만든 그래프 값과 앱이 보여주는 거리가 일치하면 데이터 처리가 정확한 것입니다.
  (데이터를 직접 확인·내려받으려면 이 파일의 ③ 로만데이터 탭을 사용할 수 있습니다.)&lt;/div&gt;

&lt;h2&gt;STEP 4 · 해석 — 데이터가 말해주는 것&lt;/h2&gt;
&lt;ol class=&quot;q&quot;&gt;
  &lt;li&gt;&lt;b&gt;Q1.&lt;/b&gt; 거리 그래프는 직선인가, 곡선인가? 그 형태가 생긴 이유를 로만의 속도와 연결해 서술하시오.
    &lt;div class=&quot;box&quot;&gt;&lt;/div&gt;&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Q2.&lt;/b&gt; deldot(km/s) 값(약 0.44~0.47)에 86,400(하루의 초)을 곱하면 얼마인가? 이 값이 E열의 하루 증가량과
    어떤 관계인지 설명하시오. &lt;div class=&quot;box&quot;&gt;&lt;/div&gt;&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Q3.&lt;/b&gt; 이 데이터는 로만이 어디로 가는 여정인가? 데이터가 실습일까지가 아니라 예측 마지막 날짜까지만
    존재하는 이유를 &quot;예측 궤적&quot;이라는 말로 설명하시오. &lt;div class=&quot;box&quot;&gt;&lt;/div&gt;&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Q4.&lt;/b&gt; 내 데이터의 1차 출처를 한 줄로 표기하시오. (형식: 제공 기관 — 시스템/항목 — 수집일)
    &lt;div class=&quot;box&quot;&gt;&lt;/div&gt;&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Q5. (심화)&lt;/b&gt; 실습일 로만까지 신호가 도착하는 데 걸리는 시간 = 거리(km) ÷ 299,792.458(km/s).
    직접 계산해 소수 둘째 자리까지 쓰시오. &lt;div class=&quot;box&quot;&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;

&lt;h2&gt;평가 기준 (자기 점검)&lt;/h2&gt;
&lt;table class=&quot;rubric&quot;&gt;
  &lt;tr&gt;&lt;th&gt;영역&lt;/th&gt;&lt;th&gt;잘함 (3)&lt;/th&gt;&lt;th&gt;보통 (2)&lt;/th&gt;&lt;th&gt;노력 요망 (1)&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;수집&lt;/td&gt;&lt;td&gt;설정을 정확히 입력해 데이터를 받았다&lt;/td&gt;&lt;td&gt;도움을 받아 받았다&lt;/td&gt;&lt;td&gt;아직 받지 못했다&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;정리&lt;/td&gt;&lt;td&gt;단위 환산과 증가량 열을 스스로 완성&lt;/td&gt;&lt;td&gt;수식 예시를 따라 완성&lt;/td&gt;&lt;td&gt;정리 미완&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;시각화&lt;/td&gt;&lt;td&gt;축·단위·제목·출처를 모두 갖춘 그래프&lt;/td&gt;&lt;td&gt;그래프 완성, 표기 일부 누락&lt;/td&gt;&lt;td&gt;그래프 미완&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;해석&lt;/td&gt;&lt;td&gt;Q1~Q4를 데이터 근거로 설명&lt;/td&gt;&lt;td&gt;일부 근거 누락&lt;/td&gt;&lt;td&gt;서술 미완&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;details&gt;
&lt;summary&gt;교사용 안내 (인쇄 시 자동으로 숨겨집니다)&lt;/summary&gt;
&lt;ul&gt;
  &lt;li&gt;&lt;b&gt;Start는 반드시 2026-08-30 12:00&lt;/b&gt;: 로만의 궤적 데이터는 분리 순간(발사 약 32분 뒤, 11:58 UT)부터 존재합니다.
      학생이 Start를 00:00으로 넣으면 &quot;No ephemeris for target ... prior to A.D. 2026-AUG-30 11:58&quot; 오류가 나는데,
      실습 전 실제 요청 1회로 미리 확인해 두시면 수업 중 원인을 바로 설명할 수 있습니다. 실습지에 오류 해독 안내를 넣어 두었으므로
      오히려 오류를 만나보게 하는 것도 방법입니다.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;데이터 공개 범위&lt;/b&gt;: Horizons에 공개된 로만 예측 궤적은 현재 2026-10-03경까지입니다.
      실습일이 그 이후라면 Stop을 2026-10-03로 설정하거나, 같은 폴더의 &lt;b&gt;데이터갱신.bat&lt;/b&gt; 실행(인터넷) 후
      로만위치추적.html의 안내를 참고해 최신 범위를 확인하세요. Horizons 웹폼에서도 요청 범위가 공개 범위를
      벗어나면 오류가 나므로, Stop을 줄여 재요청하면 됩니다.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;웹폼 UI 표현&lt;/b&gt;: Horizons 웹 애플리케이션은 개정에 따라 버튼·항목 이름이 조금씩 달라질 수 있습니다.
      핵심 파라미터(대상 -211 / 지구 중심 500 / 1 day / quantity 20 / CSV)는 동일합니다.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;delta가 AU로 나오는 것은 정상&lt;/b&gt;: OUT_UNITS를 지정해도 관측자 표의 delta는 AU로 표기됩니다.
      단위 환산(D열)이 이 실습의 핵심 학습 요소이므로 그대로 활용합니다. deldot은 km/s로 나옵니다.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;답안 요점&lt;/b&gt;: Q1 — 곡선(점점 완만), 로만이 멀어지며 감속하기 때문. Q2 — 0.47×86,400 ≈ 40,600 km/일로
      E열 값과 일치(레인지레이트는 지구 기준 멀어지는 속도). Q3 — 태양-지구 L2(약 150만 km), 발사 후 약 3개월,
      예측 궤적은 공개 범위까지만 존재하고 그 밖은 외삽이라 신뢰할 수 없음. Q5 — 예: 942,864÷299,792.458 ≈ 3.14초.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;연계 자료&lt;/b&gt;: 로만위치추적.html(위치·시간 탐색), 로만보간연습.html(두 지점 사이 값을 계산하는
      보간 알고리즘 체험 — 프로그래밍 단원 확장용).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;심화 과제&lt;/b&gt;: Horizons API를 브라우저 주소창에 붙여 넣어(예: format=json과 COMMAND=-211 등 인수) 데이터를
      받아 보기 — 웹폼과 API가 같은 서비스의 다른 인터페이스임을 확인.&lt;/li&gt;
&lt;/ul&gt;
&lt;/details&gt;

&lt;/section&gt;

&lt;section class=&quot;tabSec&quot; id=&quot;tabArrival&quot;&gt;
&lt;h2&gt;로만, L2로 도착하는 날&lt;/h2&gt;
&lt;div class=&quot;arrCard&quot;&gt;&lt;b&gt;발사&lt;/b&gt; — 2026년 8월 30일 20:26(KST) 플로리다 케네디 우주센터, 팰컨 헤비 로켓.
  20:57경 로켓 2단에서 분리되어 홀로 비행을 시작했습니다. (분리 순간부터 Horizons 궤적 데이터가 시작됩니다)&lt;/div&gt;
&lt;div class=&quot;arrCard&quot;&gt;&lt;b&gt;예상 도착&lt;/b&gt; — NASA 발표 기준 &lt;b&gt;3개월 여정&lt;/b&gt;: 발사(8/30)에서 약 3개월 뒤인
  &lt;b&gt;11월 말경&lt;/b&gt; 태양-지구 라그랑주점 2(L2, 지구에서 약 150만 km)에 도달해 관측용 궤도(헤일로 궤도)에 들어갑니다.
  NASA는 특정 일자를 확정 공개하지 않았고, 일정은 팀 평가에 따라 달라질 수 있다고 안내합니다.&lt;/div&gt;
&lt;div class=&quot;arrCard&quot;&gt;&lt;b&gt;여정 흐름&lt;/b&gt; — ① 관성 비행으로 멀어지며 감속(9월) → ② 10월 중순경 지구에서 150만 km 통과(예측 궤적 기준)
  → ③ 11월: L2 근처에서 미세 기동으로 궤도 정착 → ④ 도착 후 시운전(장비 가동·교정) → ⑤ 첫 관측 이미지 공개 →
  ⑥ Adopt a Pixel 픽셀 배정·인증서 발송&lt;/div&gt;
&lt;div class=&quot;arrCard&quot;&gt;&lt;b&gt;지금 여정 진행률&lt;/b&gt; — 내장 궤적 데이터 기준: &lt;b id=&quot;arrProgPct&quot;&gt;—&lt;/b&gt;
  &lt;div class=&quot;progOuter&quot;&gt;&lt;div class=&quot;progInner&quot; id=&quot;arrProgBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;span id=&quot;arrProgDetail&quot; style=&quot;font-size:13px;color:#5a6478&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;arrCard&quot;&gt;&lt;b&gt;참고&lt;/b&gt; — 웹b 우주망원경은 발사 후 약 30일 만에 L2에 도착했지만, 로만은 3개월을 걸어 갑니다
  (같은 목적지라도 우주선마다 여정 속도가 다릅니다). 최신 소식은 NASA 로만 블로그
  (&lt;code&gt;https://science.nasa.gov/blogs/roman/&lt;/code&gt;)에서 확인하세요.&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;도착 관련 일자는 NASA 공개 정보(시운전·임무 페이지)와 예측 궤적을 바탕으로 정리한 교육용 요약이며,
  NASA 공식 확정 일정이 아닙니다.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;tabSec&quot; id=&quot;tabDataView&quot;&gt;
&lt;h2&gt;로만 궤적 데이터 — 화면으로 보기 · 파일로 받기&lt;/h2&gt;
&lt;p&gt;이 파일 안에 NASA/JPL Horizons의 로만 궤적(천체 -211)이 내장되어 있습니다. 인터넷 없이도 열람·다운로드가 가능합니다.&lt;/p&gt;
&lt;div class=&quot;dvSummary&quot;&gt;
  &lt;span&gt;지점: &lt;b id=&quot;dvN&quot;&gt;—&lt;/b&gt;개&lt;/span&gt;
  &lt;span&gt;기간: &lt;b id=&quot;dvRange&quot;&gt;—&lt;/b&gt;&lt;/span&gt;
  &lt;span&gt;간격: &lt;b&gt;1시간&lt;/b&gt;&lt;/span&gt;
  &lt;span&gt;좌표 기준: 지구 중심&lt;/span&gt;
  &lt;span&gt;갱신일: &lt;b id=&quot;dvFetched&quot;&gt;—&lt;/b&gt;&lt;/span&gt;
&lt;/div&gt;
&lt;h3&gt;거리 변화 그래프&lt;/h3&gt;
&lt;svg id=&quot;dvChart&quot; viewBox=&quot;0 0 760 320&quot; role=&quot;img&quot; aria-label=&quot;로만 거리 변화 그래프&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;dvPager noprint&quot; id=&quot;dvPager&quot;&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvFirst&quot;&gt;« 처음&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvPrev&quot;&gt;‹ 이전&lt;/button&gt;
  &lt;span id=&quot;dvPage&quot;&gt;페이지 1 / 1&lt;/span&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvNext&quot;&gt;다음 ›&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvLast&quot;&gt;끝 »&lt;/button&gt;
&lt;/div&gt;
&lt;div style=&quot;overflow-x:auto&quot;&gt;
&lt;table class=&quot;dvTable&quot; id=&quot;dvTable&quot;&gt;&lt;tbody id=&quot;dvTbody&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;/div&gt;
&lt;h3&gt;파일로 받기&lt;/h3&gt;
&lt;div class=&quot;dvDL noprint&quot;&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvCsv&quot;&gt;CSV 내려받기 (스프레드시트용)&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvJson&quot; class=&quot;alt&quot;&gt;JSON 내려받기 (원본)&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvOws&quot; class=&quot;alt&quot;&gt;오렌지3 워크플로 내려받기 (.ows)&lt;/button&gt;
  &lt;button type=&quot;button&quot; id=&quot;dvFetch&quot; class=&quot;alt2&quot;&gt;서버데이터 수신 (로컬 서버)&lt;/button&gt;
&lt;/div&gt;
&lt;span id=&quot;dvServerMsg&quot; class=&quot;dvServer&quot;&gt;로컬 서버가 NASA 데이터를 대신 받아 이 화면의 표·그래프·요약에 바로 적용합니다. (서버 실행: 같은 폴더의 서버실행.bat)&lt;/span&gt;
&lt;p style=&quot;font-size:13px&quot;&gt;CSV는 날짜(UTC·KST), hours(발사 후 경과시간, 첫 지점 0), X·Y·Z(km), 거리(km), delta(AU),
  레인지레이트(km/s) 열로 구성되며
  엑셀에서 한글이 깨지지 않도록 BOM을 포함해 저장합니다. JSON은 앱이 사용하는 원본 형식 그대로이고, .ows는 오렌지3에서 바로 열리는 분석 워크플로 파일입니다.
  CSV의 delta(AU)·레인지레이트 열은 STEP 2에서 Horizons로 받은 delta·deldot과 같은 항목입니다.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;데이터가 최신이 아니게 되면(예측 범위 종료) 같은 폴더의 &lt;b&gt;데이터갱신.bat&lt;/b&gt;을 실행하세요 —
  이 파일의 내장 데이터도 함께 교체됩니다. 표의 delta(AU)와 STEP 2의 단위 환산(×149,597,870.7)을 비교해 보세요.&lt;/div&gt;

&lt;h3&gt;오렌지3(Orange 3)로 분석하기 — 무료 데이터 과학 프로그램&lt;/h3&gt;
&lt;p&gt;오렌지3는 위젯(분석 도구)을 선으로 연결해 데이터 분석 절차를 만드는 무료 프로그램입니다(&lt;code&gt;https://orangedatamining.com&lt;/code&gt;).
   내려받은 로만 궤적 데이터를 오렌지3에서 열어 산점도와 상자그림으로 분석하는 전 과정을 STEP A~G로 정리했습니다.
   각 단계를 펼쳐 순서대로 따라 해 보세요.&lt;/p&gt;
&lt;details open&gt;
&lt;summary&gt;STEP A · 오렌지3 설치 (컴퓨터당 1회)&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;브라우저에서 &lt;code&gt;https://orangedatamining.com/download/&lt;/code&gt; 접속 → 내 컴퓨터 운영체제용(Windows 등) &lt;b&gt;설치 파일 내려받기&lt;/b&gt;.&lt;/li&gt;
  &lt;li&gt;설치 파일 실행 → &lt;b&gt;Next(다음)&lt;/b&gt;로 기본 설정 그대로 설치합니다 (바꿀 항목 없음).&lt;/li&gt;
  &lt;li&gt;설치 후 바탕화면의 &lt;b&gt;Orange3&lt;/b&gt; 실행 — 왼쪽에 위젯 목록, 가운데에 작업 공간(캔버스)이 열립니다.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;학교 컴퓨터에 이미 설치되어 있다면 STEP A는 건너뜁니다. 설치 파일은 수백 MB이므로 수업 전 미리 설치해 두는 것이 좋습니다.&lt;/div&gt;
&lt;/details&gt;
&lt;details open&gt;
&lt;summary&gt;STEP B · 파일 두 개 내려받기 — CSV와 .ows&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;위의 &lt;b&gt;CSV 내려받기 (스프레드시트용)&lt;/b&gt; 버튼 → &lt;code&gt;로만궤적_날짜.csv&lt;/code&gt; 저장.&lt;/li&gt;
  &lt;li&gt;위의 &lt;b&gt;오렌지3 워크플로 내려받기 (.ows)&lt;/b&gt; 버튼 → &lt;code&gt;로만궤적_오렌지3.ows&lt;/code&gt; 저장.&lt;/li&gt;
  &lt;li&gt;브라우저가 &quot;내려받기&quot; 폴더에 저장하면, 두 파일을 &lt;b&gt;같은 실습 폴더&lt;/b&gt;로 옮겨 두면 편합니다.&lt;/li&gt;
&lt;/ol&gt;
&lt;/details&gt;
&lt;details open&gt;
&lt;summary&gt;STEP C · 워크플로(.ows) 열기&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;오렌지3 메뉴 &lt;b&gt;File → Open&lt;/b&gt;(시작 화면에서는 &lt;b&gt;Open&lt;/b&gt;) → STEP B의 &lt;code&gt;로만궤적_오렌지3.ows&lt;/code&gt; 선택.&lt;/li&gt;
  &lt;li&gt;작업 공간에 &lt;b&gt;File → Data Table → Scatter Plot → Box Plot&lt;/b&gt;이 선으로 연결되어 나타납니다 — 이 선이 &quot;데이터가 흐르는 길&quot;입니다.&lt;/li&gt;
  &lt;li&gt;File에 데이터가 없는 동안 뒤쪽 위젯은 회색(비활성)입니다 — STEP D에서 데이터를 넣으면 활성화됩니다.&lt;/li&gt;
&lt;/ol&gt;
&lt;/details&gt;
&lt;details open&gt;
&lt;summary&gt;STEP D · File 위젯에 CSV 연결 (가장 중요)&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;맨 왼쪽의 &lt;b&gt;File&lt;/b&gt; 위젯을 &lt;b&gt;더블클릭&lt;/b&gt; → 파일 열기 창이 뜹니다.&lt;/li&gt;
  &lt;li&gt;STEP B에서 저장한 &lt;code&gt;로만궤적_....csv&lt;/code&gt;를 선택해 열면, File 위젯이 CSV를 읽어 선을 따라 다른 위젯으로 데이터를 흘려보냅니다.&lt;/li&gt;
  &lt;li&gt;File 창에 &lt;code&gt;date_utc, date_kst, hours, X_km, Y_km, Z_km, distance_km, delta_AU, range_rate_km_s&lt;/code&gt; 열 이름이 보이면 성공.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;CSV가 파일 목록에 안 보이면 파일 형식 필터를 &quot;All files&quot;로 바꿔 보세요. 열기에 실패하면 CSV를 다시 내려받았는지(위 버튼) 확인합니다.&lt;/div&gt;
&lt;/details&gt;
&lt;details open&gt;
&lt;summary&gt;STEP E · 데이터 확인 — Data Table&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;&lt;b&gt;Data Table&lt;/b&gt; 더블클릭 → 시간별 궤적 830행이 표로 나타납니다.&lt;/li&gt;
  &lt;li&gt;&lt;code&gt;hours&lt;/code&gt;(발사 후 경과시간)가 0부터 1씩 늘어나는지(1시간 간격) 확인합니다.&lt;/li&gt;
  &lt;li&gt;&lt;code&gt;distance_km&lt;/code&gt;(지구 중심에서 로만까지 거리)를 훑어 보세요 — 약 7,300km(분리 직후)에서 144만 km 안팎까지 멀어집니다.&lt;/li&gt;
&lt;/ol&gt;
&lt;/details&gt;
&lt;details open&gt;
&lt;summary&gt;STEP F · 산점도로 변화 보기 — Scatter Plot&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;&lt;b&gt;Scatter Plot&lt;/b&gt; 더블클릭 → 위쪽 축 선택란에서 &lt;b&gt;Axis X = hours&lt;/b&gt;, &lt;b&gt;Axis Y = distance_km&lt;/b&gt;를 고릅니다.&lt;/li&gt;
  &lt;li&gt;점들이 왼쪽 아래(가까울 때)에서 오른쪽 위(멀어질 때)로 퍼지면 성공입니다.&lt;/li&gt;

&lt;summary&gt;STEP G · 상자그림으로 분포 요약 — Box Plot&lt;/summary&gt;
&lt;ol&gt;
  &lt;li&gt;&lt;b&gt;Box Plot&lt;/b&gt; 더블클릭 → Variables 목록에서 &lt;code&gt;distance_km&lt;/code&gt;를 선택합니다.&lt;/li&gt;

&lt;/ol&gt;

  &lt;p style=&quot;margin:4px 0&quot;&gt;문제를 출제하면 시각이 고정됩니다. 종이에 손으로 계산한 거리(km)를 입력해 보세요.&lt;/p&gt;

&lt;div class=&quot;card&quot;&gt;
  &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;코드&lt;/span&gt;같은 알고리즘을 코드로&lt;/h2&gt;
  &lt;details open&gt;
  &lt;summary&gt;의사코드 (한글)&lt;/summary&gt;
  &lt;pre&gt;1. 목표 시각이 몇 번째(i)와 몇 번째(i+1) 지점 사이인지 찾는다
     i = (목표 시각 − 시작 시각) ÷ 간격 의 몫
2. 두 지점 사이의 비율을 구한다
     r = (목표 시각 − t_i) ÷ 간격   (0 ≤ r ≤ 1)
3. 좌표 X, Y, Z 각각을 계산한다
     값 = 왼쪽 값 + (오른쪽 값 − 왼쪽 값) × r
4. 거리 = √(X² + Y² + Z²)&lt;/pre&gt;
  &lt;/details&gt;
  &lt;details&gt;
  &lt;summary&gt;파이썬 코드 (복사해서 사용)&lt;/summary&gt;
  &lt;pre id=&quot;pyCode&quot;&gt;# 로만 궤적 데이터(1시간 간격)로 임의 시각의 위치 구하기
# t0: 첫 지점의 JD, dt: 1/24 (1시간), X,Y,Z: 좌표 목록(천 km 단위)
def interp(jd):
    f = (jd - t0) / dt      # 몇 번째 지점 사이인가
    i = int(f)              # 왼쪽 지점 번호
    r = f - i               # 두 지점 사이의 비율 (0 ~ 1)
    x = X[i] + (X[i+1] - X[i]) * r
    y = Y[i] + (Y[i+1] - Y[i]) * r
    z = Z[i] + (Z[i+1] - Z[i]) * r
    return x * 1000, y * 1000, z * 1000    # km 단위로 변환

x, y, z = interp(목표시각)
distance = (x*x + y*y + z*z) ** 0.5
print(&quot;거리(km) =&quot;, distance)&lt;/pre&gt;
  &lt;/details&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b class=&quot;warn&quot;&gt;데이터 분석 원칙 — 내삽과 외삽&lt;/b&gt;&lt;br&gt;
    기록된 시각 &lt;b&gt;사이&lt;/b&gt;의 값을 계산하는 것을 내삽(보간)이라 하고, 기록된 범위 &lt;b&gt;밖&lt;/b&gt;을 추측하는 것을
    외삽이라 합니다. 이 앱이 슬라이더를 데이터 범위 밖으로 못 움직이게 한 이유입니다. 예측 궤적도
    NASA가 공개한 범위까지만 신뢰할 수 있습니다.&lt;/div&gt;

&quot;use strict&quot;;
(function(){
  var D = window.ROMAN_DATA;
  if (!D || !D.R || !D.R.X || !D.R.X.length){ document.getElementById(&quot;noData&quot;).style.display = &quot;block&quot;; return; }
  D = D.R;
  var $ = function(id){ return document.getElementById(id); };
  var t0 = D.t0, dt = D.dt, n = D.n;

  function fmtInt(v){ return Math.round(v).toLocaleString(&quot;ko-KR&quot;); }
  function fmt6(v){ return v.toLocaleString(&quot;ko-KR&quot;, { minimumFractionDigits: 3, maximumFractionDigits: 3 }); }
  function jdToMs(jd){ return (jd - 2440587.5) * 86400000; }
  function fmtKST(jd){
    return new Date(jdToMs(jd)).toLocaleString(&quot;ko-KR&quot;,
      { timeZone: &quot;Asia/Seoul&quot;, year: &quot;numeric&quot;, month: &quot;long&quot;, day: &quot;numeric&quot;,
        hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot;, hour12: false }) + &quot; (한국시간, 근사)&quot;;
  }
  function at(k){ return [D.X[k] * 1000, D.Y[k] * 1000, D.Z[k] * 1000]; }
  function interp(jd){
    var f = (jd - t0) / dt;
    if (!(f &gt;= -1e-6) || !(f &lt;= n - 1 + 1e-6)) return null;
    f = Math.min(Math.max(f, 0), n - 1);
    var i = Math.min(Math.floor(f), n - 2), r = f - i, j = Math.min(i + 1, n - 1);
    var a = at(i), b = at(j);
    return { i: i, j: j, r: r, a: a, b: b,
      p: [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r, a[2] + (b[2] - a[2]) * r] };
  }
  function dist(p){ return Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]); }

  var quizJd = null;
  var log = [];
  try { log = JSON.parse(window.localStorage.getItem(&quot;romanIp_v1&quot;) || &quot;[]&quot;) || []; } catch(e){ log = []; }

  function saveLog(){
    try { window.localStorage.setItem(&quot;romanIp_v1&quot;, JSON.stringify(log.slice(0, 10))); } catch(e){}
  }
  function renderLog(){
    var box = $(&quot;ipLog&quot;);
    box.textContent = &quot;&quot;;
    if (!log.length){ return; }
    log.forEach(function(it){
      var d1 = document.createElement(&quot;div&quot;);
      d1.className = &quot;logline&quot;;
      d1.innerHTML = &quot;발사 후 &lt;b&gt;&quot; + it.h + &quot;시간&lt;/b&gt; — 내 답 &lt;b&gt;&quot; + fmtInt(it.my) +
        &quot; km&lt;/b&gt; · 정답 &lt;b&gt;&quot; + fmtInt(it.correct) + &quot; km&lt;/b&gt; · 오차 &lt;b&gt;&quot; + it.err.toFixed(2) + &quot;%&lt;/b&gt; &quot; +
        (it.ok ? &quot;&lt;span class=resOk&gt;정답&lt;/span&gt;&quot; : &quot;&lt;span class=resBad&gt;아쉬움&lt;/span&gt;&quot;);
      box.appendChild(d1);
    });
  }

  function render(jd){
    var res = interp(jd);
    if (!res){ return; }
    var hours = (jd - t0) / dt * 1;
    $(&quot;ipSlider&quot;).value = Math.round(hours / (n - 1) * 1000);
    $(&quot;ipHour&quot;).textContent = fmt6(hours);
    $(&quot;ipKst&quot;).textContent = fmtKST(jd);
    $(&quot;ipIdxI&quot;).textContent = &quot;i=&quot; + res.i;
    $(&quot;ipIdxJ&quot;).textContent = &quot;i+1=&quot; + res.j;
    $(&quot;ipTi&quot;).textContent = (t0 + res.i * dt).toFixed(7);
    $(&quot;ipTj&quot;).textContent = (t0 + res.j * dt).toFixed(7);
    $(&quot;ipXi&quot;).textContent = fmt6(res.a[0] / 1000); $(&quot;ipYi&quot;).textContent = fmt6(res.a[1] / 1000); $(&quot;ipZi&quot;).textContent = fmt6(res.a[2] / 1000);
    $(&quot;ipXj&quot;).textContent = fmt6(res.b[0] / 1000); $(&quot;ipYj&quot;).textContent = fmt6(res.b[1] / 1000); $(&quot;ipZj&quot;).textContent = fmt6(res.b[2] / 1000);
    $(&quot;ipRFormula&quot;).textContent = &quot;r = (T − t_i) ÷ (t_i+1 − t_i) = &quot; + res.r.toFixed(4);
    $(&quot;ipR&quot;).textContent = res.r.toFixed(4);
    $(&quot;ipRBar&quot;).style.width = (res.r * 100).toFixed(2) + &quot;%&quot;;
    $(&quot;ipRx&quot;).textContent = &quot;X = &quot; + fmt6(res.a[0] / 1000) + &quot; + (&quot; + fmt6(res.b[0] / 1000) + &quot; − &quot; + fmt6(res.a[0] / 1000) + &quot;) × &quot; + res.r.toFixed(4) + &quot; = &quot; + fmt6(res.p[0] / 1000);
    $(&quot;ipRy&quot;).textContent = &quot;Y = &quot; + fmt6(res.a[1] / 1000) + &quot; + (&quot; + fmt6(res.b[1] / 1000) + &quot; − &quot; + fmt6(res.a[1] / 1000) + &quot;) × &quot; + res.r.toFixed(4) + &quot; = &quot; + fmt6(res.p[1] / 1000);
    $(&quot;ipRz&quot;).textContent = &quot;Z = &quot; + fmt6(res.a[2] / 1000) + &quot; + (&quot; + fmt6(res.b[2] / 1000) + &quot; − &quot; + fmt6(res.a[2] / 1000) + &quot;) × &quot; + res.r.toFixed(4) + &quot; = &quot; + fmt6(res.p[2] / 1000);
    $(&quot;ipDist&quot;).textContent = fmtInt(dist(res.p));
    $(&quot;ipBadge&quot;).style.display = &quot;inline-block&quot;;
    return res;
  }

  $(&quot;ipSlider&quot;).addEventListener(&quot;input&quot;, function(){
    quizJd = null;
    $(&quot;quizHour&quot;).textContent = &quot;—&quot;;
    var h = parseFloat($(&quot;ipSlider&quot;).value) / 1000 * (n - 1);
    render(t0 + h * dt);
  });
  $(&quot;btnQuiz&quot;).addEventListener(&quot;click&quot;, function(){
    var h = Math.round(4 + Math.random() * (n - 9) * 2) / 2;
    quizJd = t0 + h * dt;
    $(&quot;quizHour&quot;).textContent = &quot;문제: 발사 후 &quot; + h + &quot;시간 시점&quot;;
    $(&quot;ansInput&quot;).value = &quot;&quot;;
    $(&quot;quizResult&quot;).textContent = &quot;&quot;;
    render(quizJd);
  });
  $(&quot;btnCheck&quot;).addEventListener(&quot;click&quot;, function(){
    if (quizJd === null){
      $(&quot;quizResult&quot;).innerHTML = '&lt;span class=&quot;resBad&quot;&gt;먼저 문제를 출제하세요.&lt;/span&gt;';
      return;
    }
    var my = parseFloat($(&quot;ansInput&quot;).value);
    if (!isFinite(my) || my &lt;= 0){
      $(&quot;quizResult&quot;).innerHTML = '&lt;span class=&quot;resBad&quot;&gt;거리(km)를 숫자로 입력하세요.&lt;/span&gt;';
      return;
    }
    var correct = dist(interp(quizJd).p);
    var errP = Math.abs(my - correct) / correct * 100;
    var okHit = errP &lt;= 0.1;
    $(&quot;quizResult&quot;).innerHTML = (okHit
      ? '&lt;span class=&quot;resOk&quot;&gt;정답!&lt;/span&gt; 오차 ' + errP.toFixed(3) + &quot;%&quot;
      : '&lt;span class=&quot;resBad&quot;&gt;정답은 ' + fmtInt(correct) + ' km&lt;/span&gt; — 내 답과 ' + errP.toFixed(2) + &quot;% 차이&quot;) +
      &quot; · 오차 0.1% 이내면 정답&quot;;
    log.unshift({ h: (quizJd - t0) / dt, my: my, correct: correct, err: errP, ok: okHit });
    log = log.slice(0, 10);
    saveLog();
    renderLog();
  });

  renderLog();
  render(t0 + 12 * dt);

  window.IP = { interp: interp, dist: dist, data: D, hours: function(jd){ return (jd - t0) / dt; }, quizJd: function(){ return quizJd; } };
})();
&lt;/script&gt;

        "안녕하세요! 로만 임무와 수학 실습을 도와주는 AI입니다.\n" +
        "예: \"L2가 무슨 뜻이에요?\", \"진행률은 어떻게 계산해요?\", \"상자그림 읽는 법 알려줘\"\n" +
        "(AI를 쓰려면 같은 폴더의 서버실행.bat이 켜져 있어야 합니다)");
      try { input.focus(); } catch (e) {}
    }
  }

  function addBubble(role, text){
    var el = document.createElement("div");
    el.className = "rmAI-msg rmAI-" + role;
    el.textContent = text; // textContent만 사용 — 스크립트 삽입 방지
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function send(){
    if (busy) return;
    var text = (input.value || "").trim();
    if (!text) return;
    input.value = "";
    addBubble("user", text);
    history.push({ role: "user", content: text });
    if (history.length > 20) history = history.slice(-20); // 컨텍스트 한도 보호
    ask();
  }

  function ask(){
    busy = true;
    sendBtn.disabled = true;
    var think = addBubble("ai", "생각 중...");
    var ctrl = new AbortController();               // 타임아웃 (참고서 10항)
    var timer = setTimeout(function(){ ctrl.abort(); }, TIMEOUT_MS);
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-20), page: document.title }),
      signal: ctrl.signal
    }).then(function(r){ clearTimeout(timer); return r.json(); })
      .then(function(d){
        var content = d && d.ok && typeof d.content === "string" ? d.content.trim() : null;
        if (content){
          think.textContent = content;              // 서버도 trim하지만 이중 방어 (참고서 6항)
          history.push({ role: "assistant", content: content });
        } else {
          think.textContent = (d && d.message) || "응답을 받지 못했습니다. 잠시 후 다시 시도해 주세요.";
        }
      })
      .catch(function(err){
        clearTimeout(timer);
        if (err && err.name === "AbortError"){
          think.textContent = "응답 시간 초과(" + (TIMEOUT_MS / 1000) + "초). 잠시 후 다시 시도해 주세요.";
        } else {
          think.textContent = "로컬 AI 서버에 연결할 수 없습니다. 같은 폴더의 서버실행.bat을 먼저 실행해 주세요.";
        }
      })
      .then(function(){ busy = false; sendBtn.disabled = false; });
  }

  // 검사/외부용 최소 노출
  window.RMAI = {
    toggle: toggle,
    isOpen: function(){ return !panel.hidden; },
    history: function(){ return history.slice(); },
    send: send,
    api: API_URL,
    timeoutMs: TIMEOUT_MS
  };
})();
</script>
</body>
</html>
